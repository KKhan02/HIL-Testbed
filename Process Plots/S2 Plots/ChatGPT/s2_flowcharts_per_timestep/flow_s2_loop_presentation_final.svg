<rect x="880" y="1033" width="200" height="34" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="980.0" y="1055.0" text-anchor="middle" class="node-title" font-size="11.0" fill="#FFFFFF">loop complete</text>
<path d="M860 1050 L878 1050" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="868.0" y="1044" text-anchor="start" fill="#111111" font-size="10" font-weight="700">no</text>
<path d="M760 1067 L760 1072 L18 1072 L18 20 L388 20" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="772" y="1081.0" text-anchor="start" fill="#3D8FD9" font-size="10" font-weight="700">yes - next t</text>
<rect x="1120" y="24" width="760" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1120" y="326" width="760" height="290" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1120" y="638" width="760" height="350" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1142" y="54" text-anchor="start" fill="#111111" font-size="17" font-weight="700">OLTC decision semantics</text>
<text x="1142" y="88" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Control signal is the mean voltage across all selected secondary busbars.</text>
<text x="1142" y="120" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">vm_ctrl &gt; 1.02: candidate = current_tap + calibrated sign.</text>
<text x="1142" y="152" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">vm_ctrl &lt; 0.98: candidate = current_tap - calibrated sign.</text>
<text x="1142" y="184" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Only one tap step is requested per timestep; candidate is clipped to the ganged range.</text>
<text x="1142" y="216" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Inside the deadband no post-PF is run; valid pre-PF results are reused.</text>
<text x="1142" y="248" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">If clipping returns current_tap, the controller records tap_limit_reached and also reuses pre-PF.</text>
<text x="1142" y="358" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Post-tap + rollback semantics</text>
<text x="1142" y="394" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Candidate PF converges: accept the move and set tap_changed=True.</text>
<text x="1142" y="428" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Candidate PF fails: restore prev_tap and set blocked_reason=post_pf_non_convergence.</text>
<text x="1142" y="462" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">A second runpp() is attempted after rollback to rebuild valid result tables.</text>
<text x="1142" y="496" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Rollback success is recorded as converged=True but post_pf_reused=False.</text>
<text x="1142" y="530" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Rollback failure leaves converged_post=False and empty result tables.</text>
<text x="1142" y="564" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">No reactive-power control or active-power curtailment exists in Scenario 2.</text>
<text x="1142" y="670" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Publisher / failure semantics + implementation note</text>
<text x="1142" y="706" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">Normal path: build record -&gt; on_timestep(rec) -&gt; append -&gt; optional t%96 progress.</text>
<text x="1142" y="743" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">Pre-PF failure appends its failed record directly, then continue: no on_timestep() and no t%96 branch.</text>
<text x="1142" y="780" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">The pre-PF failure rail and blue next-timestep rail are intentionally separate.</text>
<text x="1142" y="817" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">Current source edge case: if rollback PF also fails, der_gen_mw_t/load_mw_t are not assigned in that branch.</text>
<text x="1142" y="854" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">If this is the first such occurrence record construction can raise; otherwise stale prior-loop values can be reused.</text>
<text x="1142" y="891" text-anchor="start" fill="#111111" font-size="11.7" font-weight="600">This note reflects the supplied implementation and is not silently corrected by the diagram.</text>
</svg>