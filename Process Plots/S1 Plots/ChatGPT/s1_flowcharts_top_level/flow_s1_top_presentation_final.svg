<text x="500.0" y="373" text-anchor="middle" class="node-sub" font-size="14" fill="#FFFFFF" opacity="0.90">DER active power; load active + reactive power</text>
<rect x="140.0" y="432" width="720" height="70" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
