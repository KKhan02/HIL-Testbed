<text x="357.0" y="1011" text-anchor="middle" fill="#111111" font-size="8.3" font-weight="700">no</text>
<path d="M575 1018 L710 1018 L710 1040" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="603.0" y="1011" text-anchor="middle" fill="#111111" font-size="8.3" font-weight="700">yes</text>
<rect x="1060" y="24" width="820" height="255" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1060" y="301" width="820" height="320" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1060" y="643" width="820" height="395" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1084" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Plugin configuration and import</text>
<text x="1084" y="92" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">YAML defines a unique scenario name and label, Python module path, function, hardware flag and optional kwargs.</text>
<text x="1084" y="122" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">load_plugin validates the schema and resolves module/firmware paths relative to the YAML directory.</text>
<text x="1084" y="152" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">The controller module is imported directly from its file path and the configured function must be callable.</text>
<text x="1084" y="182" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">Configured kwargs are bound before execution, so the scenario runner always sees controller_fn(vm_pu, p_mw).</text>
<text x="1084" y="212" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">gate_clean_timesteps and clamp_to_net_limits are carried into the custom scenario unchanged.</text>
<text x="1084" y="242" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">For hardware:true, the YAML also identifies the firmware sketch used for this run&#x27;s traceability.</text>
<text x="1084" y="334" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Software / hardware controller routing</text>
<text x="1084" y="369" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">The Python controller is always available as the software execution path and dry-run mirror.</text>
<text x="1084" y="401" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">hardware:true selects Arduino execution only when the benchmark is not dry-run and a serial port is supplied.</text>
<text x="1084" y="433" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">Otherwise execution remains on the Python controller and the benchmark continues without opening serial hardware.</text>
<text x="1084" y="465" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">HardwareControllerFn owns the Arduino interface: first call opens the port and performs INIT/CFG/P configuration.</text>
<text x="1084" y="497" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">Each controller call sends DER voltages and receives Q setpoints through the standard V:/Q: exchange.</text>
<text x="1084" y="529" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">If installed-P metadata changes, the hardware wrapper reconfigures before the next exchange.</text>
<text x="1084" y="561" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">The wrapper is closed in the outer finally block, so END is sent on both successful and failed benchmark runs.</text>
<text x="1084" y="676" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Benchmark registration and public return</text>
<text x="1084" y="712" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">A plugin receives a dynamic scenario number &gt;= 10 and a temporary ScenarioSpec pointing to _plugin_runner.</text>
<text x="1084" y="752" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">The caller&#x27;s BenchmarkConfig is copied; the plugin number is added without mutating the caller&#x27;s scenario list.</text>
<text x="1084" y="792" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">run_benchmark executes the custom controller alongside the selected built-in scenarios on isolated network copies.</text>
<text x="1084" y="832" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">The registry entry is removed after the run so later registrations start from a clean framework state.</text>
<text x="1084" y="872" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">If the plugin scenario failed inside benchmark isolation, register_and_run raises with the stored traceback.</text>
<text x="1084" y="912" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">A stored already-complete summary is converted back to a ScenarioResult at this public API boundary.</text>
<text x="1084" y="952" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">return_benchmark=False returns the custom ScenarioResult only; True additionally returns the full BenchmarkResult.</text>
</svg>