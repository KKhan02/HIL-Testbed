<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860">
<title>CLI wizard RunPlan construction - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="1052" height="832" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="540.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">CLI Wizard - Index-Walked RunPlan Construction</text>
<rect x="250" y="60" width="620" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="560.0" y="85.08" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">run_wizard()</text>
<text x="560.0" y="101.08" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.92">state = {}</text>
<rect x="210" y="145" width="700" height="112" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="560.0" y="180.536" text-anchor="middle" class="node-title" font-size="10.4" fill="#FFFFFF">Define 9 wizard steps and set index = 0</text>
<text x="560.0" y="196.536" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">Study -&gt; Network -&gt; Network modifications -&gt; Dataset -&gt; Time window</text>
<text x="560.0" y="212.536" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">Parameters -&gt; Hardware -&gt; Streaming -&gt; Controller plugin</text>
<text x="560.0" y="228.536" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">each callback writes its result into the shared state dict</text>
<path d="M560 118 L560 143" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="560,301.0 685.0,330 560,359.0 435.0,330" fill="#854F0B"/>
<text x="560" y="333.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">index &lt; len(steps)?</text>
<path d="M560 257 L560 299" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="250" y="390" width="620" height="100" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="560.0" y="427.502" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">name, fn = steps[index]; try: fn(state)</text>
<text x="560.0" y="443.502" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">print Step i/9 rule, then run the step-specific prompts and validation</text>
<text x="560.0" y="459.502" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">plugin network: Dataset step inserts DatasetConfig(&#x27;plugin&#x27;) instead of prompting</text>
<path d="M560 359 L560 388" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="574" y="373.0" text-anchor="start" fill="#7A5C12" font-size="8.0" font-weight="700">yes</text>
<polygon points="155,411.0 250.0,440 155,469.0 60.0,440" fill="#854F0B"/>
<text x="155" y="443.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">index == 0?</text>
<path d="M250 440 L252 440" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="250.0" y="431.0" text-anchor="middle" fill="#3D8FD9" font-size="7.5" font-weight="700">BackRequested</text>
<rect x="55" y="490" width="200" height="48" rx="8" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="155.0" y="508.788" text-anchor="middle" class="node-title" font-size="8.2" fill="#FFFFFF">Print first-step notice</text>
<text x="155.0" y="524.788" text-anchor="middle" class="node-sub" font-size="5.9" fill="#FFFFFF" opacity="0.92">Already at the first step</text>
<path d="M155 469 L155 488" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="166" y="480.0" text-anchor="start" fill="#7A5C12" font-size="7.3" font-weight="700">yes</text>
<circle cx="155" cy="560" r="9" fill="#5F5E5A"/>
<path d="M155 538 L155 549" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M60 440 L35 440 L35 560 L144 560" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="42.0" y="432" text-anchor="end" fill="#111111" font-size="7.3" font-weight="700">no</text>
<rect x="55" y="596" width="200" height="58" rx="8" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="155.0" y="619.856" text-anchor="middle" class="node-title" font-size="8.4" fill="#FFFFFF">index = max(index - 1, 0)</text>
<text x="155.0" y="635.856" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">continue -&gt; previous step / re-ask step 1</text>
<path d="M155 569 L155 594" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="430" y="535" width="260" height="58" rx="9" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="560.0" y="559.162" text-anchor="middle" class="node-title" font-size="9.3" fill="#FFFFFF">index += 1</text>
<text x="560.0" y="575.162" text-anchor="middle" class="node-sub" font-size="6.7" fill="#FFFFFF" opacity="0.92">normal return from callback</text>
<path d="M560 490 L560 533" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="574.0" y="504" text-anchor="start" fill="#111111" font-size="7.4" font-weight="700">normal return</text>
<circle cx="560" cy="625" r="10" fill="#5F5E5A"/>
<path d="M560 593 L560 613" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M255 625 L548 625" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M560 635 L560 680 L12 680 L12 330 L433 330" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="22" y="670" text-anchor="start" fill="#3D8FD9" font-size="7.4" font-weight="700">next loop test</text>
<rect x="245" y="715" width="630" height="96" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="560.0" y="742.434" text-anchor="middle" class="node-title" font-size="10.1" fill="#FFFFFF">Return RunPlan(...) from state</text>
<text x="560.0" y="758.434" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">study; NetworkConfig; DatasetConfig; ParameterConfig; hardware/port</text>
<text x="560.0" y="774.434" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">stream_every_k; controller plugin; hc_stressed; time_period/time_index</text>
<text x="560.0" y="790.434" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">run_id/output_dir and other omitted fields use RunPlan dataclass defaults</text>
<path d="M685 330 L1015 330 L1015 763 L877 763" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="715.0" y="322" text-anchor="start" fill="#7A5C12" font-size="7.7" font-weight="700">no - all 9 steps complete</text>
</svg>