<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1520" viewBox="0 0 920 1520"><title>profile_builder fallback weather-to-power path - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowRed" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#993C1D"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-red{fill:none;stroke:#993C1D;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="18" y="18" width="884" height="1484" rx="18" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.6"/>
<text x="460.0" y="48" text-anchor="middle" fill="#111111" font-size="20" font-weight="700">profile_builder - Fallback Weather-to-Power Path</text>
<rect x="245.0" y="78" width="430" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="104.5" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">build_annual_profiles()</text>
<text x="460.0" y="119.5" text-anchor="middle" class="node-sub" font-size="10.2" fill="#FFFFFF" opacity="0.90">net, net_name, data_dir, file_map, col_map</text>
<rect x="245.0" y="170" width="430" height="84" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="460.0" y="196.5" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">Load weather source tables</text>
<text x="460.0" y="211.5" text-anchor="middle" class="node-sub" font-size="9.0" fill="#FFFFFF" opacity="0.90">solar_df = load_dwd_solar(...)</text>
<text x="460.0" y="224.5" text-anchor="middle" class="node-sub" font-size="9.0" fill="#FFFFFF" opacity="0.90">wind_raw = load_dwd_wind(...)</text>
<text x="460.0" y="237.5" text-anchor="middle" class="node-sub" font-size="9.0" fill="#FFFFFF" opacity="0.90">temp_df = load_dwd_temperature(...)</text>
<polygon points="460,288.0 600.0,320 460,352.0 320.0,320" fill="#854F0B"/>
<text x="460" y="324" text-anchor="middle" class="node-title" font-size="12.3" fill="#FFFFFF">custom RAD-G file mapped?</text>
<rect x="55" y="289" width="225" height="62" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="167.5" y="311.0" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Solar unit semantics</text>
<text x="167.5" y="326.0" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">explicit RAD-G in file_map</text>
<text x="167.5" y="339.0" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">treat source as W/m2 directly</text>
<rect x="640" y="281" width="225" height="78" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="752.5" y="304.5" text-anchor="middle" class="node-title" font-size="10.6" fill="#FFFFFF">DWD solar conversion</text>
<text x="752.5" y="319.5" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">if RAD-G not explicitly mapped:</text>
<text x="752.5" y="332.5" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">infer median sample interval</text>
<text x="752.5" y="345.5" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">J/cm2 -&gt; W/m2 then clip GHI &gt;=0</text>
<circle cx="460" cy="404" r="12" fill="#5F5E5A"/>
<rect x="245.0" y="442" width="430" height="92" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="472.5" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">Weather cleanup + alignment</text>
<text x="460.0" y="487.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">loaders numeric-coerce; solar/wind drop NaN after cleanup</text>
<text x="460.0" y="500.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">drop duplicate timestamps in each weather table</text>
<text x="460.0" y="513.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">intersect solar, wind, and temperature indices</text>
<polygon points="460,568.0 600.0,600 460,632.0 320.0,600" fill="#854F0B"/>
<text x="460" y="604" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">complete calendar year exists?</text>
<rect x="50" y="561" width="255" height="78" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="177.5" y="584.5" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">Select complete year</text>
<text x="177.5" y="599.5" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.90">scan sorted years ascending</text>
<text x="177.5" y="612.5" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.90">pick first year covering months 1..12</text>
<text x="177.5" y="625.5" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.90">implementation therefore selects earliest complete year</text>
<rect x="620" y="566" width="270" height="68" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="755.0" y="591.0" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">No complete year</text>
<text x="755.0" y="606.0" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">choose year with most aligned timesteps</text>
<text x="755.0" y="619.0" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">emit warning in console</text>
<circle cx="460" cy="694" r="12" fill="#5F5E5A"/>
<rect x="245.0" y="732" width="430" height="74" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="760.0" text-anchor="middle" class="node-title" font-size="12.3" fill="#FFFFFF">Trim weather tables to target_year</text>
<text x="460.0" y="775.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">times = times[times.year == target_year]</text>
<text x="460.0" y="788.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">solar_df / wind_raw / temp_df = .loc[times]</text>
<rect x="245.0" y="840" width="430" height="72" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="860.5" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Build per-element profiles</text>
<text x="460.0" y="875.5" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">load_df = compute_load_profiles_bdew(net, times)</text>
<text x="460.0" y="888.5" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">loop PV sgens -&gt; compute_pv_profile(...)</text>
<text x="460.0" y="901.5" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">loop wind sgens -&gt; compute_wind_profile(...)</text>
<rect x="40" y="950" width="255" height="138" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="167.5" y="984.0" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">BDEW 2025 load profiles</text>
<text x="167.5" y="999.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">metadata -&gt; H25/G25/L25</text>
<text x="167.5" y="1012.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">missing metadata -&gt; seeded 82/15/3 mix</text>
<text x="167.5" y="1025.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">one raw shape per unique BDEW type</text>
<text x="167.5" y="1038.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">normalize each shape by its own peak</text>
<text x="167.5" y="1051.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">scale each load so profile max = net.load.p_mw</text>
<text x="167.5" y="1064.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">clip &gt;=0; fill NaN = 0</text>
<rect x="332.5" y="942" width="255" height="154" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="977.5" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">PV per sgen</text>
<text x="460.0" y="992.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">Erbs: GHI -&gt; DNI + DHI -&gt; POA</text>
<text x="460.0" y="1005.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">POA fill NaN=0; clip &gt;=0; POA &lt;10 W/m2 -&gt;0</text>
<text x="460.0" y="1018.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">NOCT air temp or 15 C fallback</text>
<text x="460.0" y="1031.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">temperature-corrected DC -&gt; inverter AC</text>
<text x="460.0" y="1044.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">reindex fill NaN=0; clip 0..rated</text>
<text x="460.0" y="1057.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">night-zero for hour &gt;=22 or &lt;=4</text>
<text x="460.0" y="1070.5" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.90">empty DataFrame if no PV units found</text>
<rect x="625" y="950" width="255" height="138" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="752.5" y="984.0" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">Wind per sgen</text>
<text x="752.5" y="999.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">loader clips wind speed &gt;=0 and drops NaN</text>
<text x="752.5" y="1012.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">piecewise cubic power curve</text>
<text x="752.5" y="1025.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">0 below 3 m/s; cubic to 12 m/s</text>
<text x="752.5" y="1038.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">rated to 25 m/s; 0 at/above cut-out</text>
<text x="752.5" y="1051.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">clip output 0..rated</text>
<text x="752.5" y="1064.0" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.90">empty DataFrame if no wind units found</text>
<circle cx="460" cy="1132" r="12" fill="#5F5E5A"/>
<rect x="245.0" y="1168" width="430" height="82" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="460.0" y="1200.0" text-anchor="middle" class="node-title" font-size="12.8" fill="#FFFFFF">Assemble common profile result</text>
<text x="460.0" y="1215.0" text-anchor="middle" class="node-sub" font-size="8.9" fill="#FFFFFF" opacity="0.90">result = {load, pv, wind, times, net_type}</text>
<text x="460.0" y="1228.0" text-anchor="middle" class="node-sub" font-size="8.9" fill="#FFFFFF" opacity="0.90">fallback schema matches the SimBench branch</text>
<rect x="245.0" y="1286" width="430" height="78" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="1316.0" text-anchor="middle" class="node-title" font-size="12.3" fill="#FFFFFF">find_extreme_days(result)</text>
<text x="460.0" y="1331.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">safe_sum handles empty PV/wind frames</text>
<text x="460.0" y="1344.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">daily means -&gt; max/min DER and load day</text>
<rect x="245.0" y="1400" width="430" height="52" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="1431.0" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">return profiles dict</text>
