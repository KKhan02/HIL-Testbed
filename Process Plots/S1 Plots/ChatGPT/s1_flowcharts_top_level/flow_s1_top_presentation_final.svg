<rect x="1120" y="28" width="760" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1120" y="330" width="760" height="300" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1120" y="652" width="760" height="340" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1142" y="60" text-anchor="start" fill="#111111" font-size="18" font-weight="700">Baseline execution contract</text>
<text x="1142" y="96" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">No manual control loop, OLTC, SVC, Volt-Var, OPF, curtailment, or hardware path.</text>
<text x="1142" y="132" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">run_timeseries() owns the annual power-flow sweep through pandapower controllers.</text>
<text x="1142" y="168" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Violation detection is deliberately deferred until after the entire sweep.</text>
<text x="1142" y="204" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">continue_on_divergence=True allows later timesteps to run after an individual PF failure.</text>
<text x="1142" y="240" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">The runner controls DER p_mw only; it does not explicitly overwrite sgen q_mvar.</text>
<text x="1142" y="362" text-anchor="start" fill="#111111" font-size="18" font-weight="700">Publisher / checkpoint semantics</text>
<text x="1142" y="400" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">enable_checkpointing and live_csv_rewrite_fn are accepted but not used for resume/progress logic.</text>
<text x="1142" y="439" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Scenario 1 never calls get_resume_records(), so a prior checkpoint cannot skip or resume the sweep.</text>
<text x="1142" y="478" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">on_timestep() is called only while post-processing converged logged timesteps.</text>
<text x="1142" y="517" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">A non-converged logged timestep is appended directly and therefore is not sent to on_timestep().</text>
<text x="1142" y="556" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">PublishHandle may still write checkpoint lines during post-processing, but this runner will not consume them on restart.</text>
<text x="1142" y="684" text-anchor="start" fill="#111111" font-size="18" font-weight="700">Data and timing semantics</text>
<text x="1142" y="722" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">DFData/ConstControl use integer timestep rows and actual element indices as profile columns.</text>
<text x="1142" y="763" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">OutputWriter logs vm_pu, line/trafo loading, line/trafo losses, and ext_grid p_mw.</text>
<text x="1142" y="804" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">_timed_runpp() records runpp wall time keyed by OutputWriter.time_step.</text>
<text x="1142" y="845" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">Source comment says the timing map is cleared per call, but the supplied runner does not call _RUNPP_TIMING.clear().</text>
<text x="1142" y="886" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">That discrepancy is an implementation note, not silently changed by the diagram.</text>
</svg>