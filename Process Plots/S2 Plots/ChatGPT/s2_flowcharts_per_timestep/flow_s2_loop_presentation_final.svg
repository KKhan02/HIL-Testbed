<text x="205.0" y="690" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">current_tap=candidate; changed=True</text>
<rect x="650" y="647" width="310" height="62" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
