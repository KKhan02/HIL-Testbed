<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1165" viewBox="0 0 1080 1165">
<title>HIL CLI top-level entry - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="1052" height="1137" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="540.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">HIL CLI - Entry, Preset Recovery and Executor Dispatch</text>
<rect x="250" y="62" width="620" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="560.0" y="87.114" text-anchor="middle" class="node-title" font-size="12.1" fill="#FFFFFF">python -m &lt;cli package&gt; -&gt; __main__.main()</text>
<text x="560.0" y="103.114" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.92">plan = None</text>
<polygon points="560,144.0 710.0,175 560,206.0 410.0,175" fill="#854F0B"/>
<text x="560" y="178.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Load a saved preset instead of wizard?</text>
<path d="M560 120 L560 142" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="735" y="140" width="300" height="70" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="885.0" y="162.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">_load_preset()</text>
<text x="885.0" y="178.298" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">read JSON -&gt; RunPlan.from_dict</text>
<text x="885.0" y="194.298" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">semantic warnings may require confirmation</text>
<path d="M710 175 L733 175" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="722.5" y="167" text-anchor="middle" fill="#7A5C12" font-size="8.1" font-weight="700">yes</text>
<polygon points="560,271.0 690.0,300 560,329.0 430.0,300" fill="#854F0B"/>
<text x="560" y="303.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">plan is None?</text>
<path d="M560 206 L560 269" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="575" y="221.0" text-anchor="start" fill="#111111" font-size="8.1" font-weight="700">no</text>
<path d="M885 210 L885 300 L692 300" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="250" y="360" width="620" height="66" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="560.0" y="388.74" text-anchor="middle" class="node-title" font-size="11.0" fill="#FFFFFF">run_wizard()</text>
<text x="560.0" y="404.74" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.92">collect a complete RunPlan through the 9-step wizard</text>
<path d="M560 329 L560 358" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="575" y="344.0" text-anchor="start" fill="#7A5C12" font-size="8.1" font-weight="700">yes</text>
<circle cx="560" cy="470" r="11" fill="#5F5E5A"/>
<path d="M560 426 L560 457" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 300 L180 300 L180 470 L547 470" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="402.0" y="292" text-anchor="end" fill="#7A5C12" font-size="8.1" font-weight="700">no</text>
<rect x="250" y="505" width="620" height="64" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="560.0" y="532.502" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">print_run_plan(plan) - called twice consecutively</text>
<text x="560.0" y="548.502" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">current __main__.py behavior before the Proceed prompt</text>
<path d="M560 481 L560 503" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="560,601.0 680.0,630 560,659.0 440.0,630" fill="#854F0B"/>
<text x="560" y="633.74" text-anchor="middle" class="node-title" font-size="11.0" fill="#FFFFFF">Proceed?</text>
<path d="M560 569 L560 599" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="55" y="598" width="240" height="64" rx="9" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="175.0" y="625.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">Cancel CLI</text>
<text x="175.0" y="641.23" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">print Cancelled; sys.exit(0)</text>
<path d="M440 630 L297 630" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="367.5" y="622" text-anchor="middle" fill="#111111" font-size="8.0" font-weight="700">no</text>
<polygon points="560,721.0 690.0,750 560,779.0 430.0,750" fill="#854F0B"/>
<text x="560" y="753.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Save as preset?</text>
<path d="M560 659 L560 719" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="574" y="674.0" text-anchor="start" fill="#7A5C12" font-size="8.0" font-weight="700">yes</text>
<rect x="750" y="718" width="270" height="64" rx="9" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="885.0" y="745.026" text-anchor="middle" class="node-title" font-size="8.9" fill="#FFFFFF">_save_preset(plan)</text>
<text x="885.0" y="761.026" text-anchor="middle" class="node-sub" font-size="6.5" fill="#FFFFFF" opacity="0.92">prompt name; non-empty name -&gt; write presets/&lt;name&gt;.json</text>
<path d="M690 750 L748 750" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="720.0" y="742" text-anchor="middle" fill="#7A5C12" font-size="8.0" font-weight="700">yes</text>
<circle cx="560" cy="845" r="11" fill="#5F5E5A"/>
<path d="M560 779 L560 832" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="574" y="794.0" text-anchor="start" fill="#111111" font-size="8.0" font-weight="700">no</text>
<path d="M885 782 L885 845 L573 845" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="300" y="885" width="520" height="70" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="560.0" y="915.604" text-anchor="middle" class="node-title" font-size="10.6" fill="#FFFFFF">try: sys.exit(executor.execute(plan))</text>
<text x="560.0" y="931.604" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">normal executor return is passed directly to sys.exit</text>
<path d="M560 856 L560 883" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="30" y="887" width="220" height="66" rx="9" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="140.0" y="915.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">KeyboardInterrupt</text>
<text x="140.0" y="931.094" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">print Interrupted; exit 130</text>
<path d="M300 920 L252 920" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="275.0" y="912.0" text-anchor="middle" fill="#D85A30" font-size="7.3" font-weight="700">KeyboardInterrupt</text>
<rect x="870" y="886" width="180" height="68" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="960.0" y="914.822" text-anchor="middle" class="node-title" font-size="8.3" fill="#FFFFFF">Unexpected wrapper error</text>
<text x="960.0" y="930.822" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">print_error_message; exit 1</text>
<path d="M820 920 L868 920" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="845.0" y="912.0" text-anchor="middle" fill="#D85A30" font-size="7.2" font-weight="700">other exception</text>
<rect x="330" y="1025" width="460" height="62" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="560.0" y="1051.4" text-anchor="middle" class="node-title" font-size="10.0" fill="#FFFFFF">Process exits with returned executor ExitCode</text>
<text x="560.0" y="1067.4" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">0, 2-8 or 130 depending on executor outcome</text>
<path d="M560 955 L560 1023" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="574.0" y="970" text-anchor="start" fill="#111111" font-size="7.7" font-weight="700">normal return</text>
</svg>