<text x="500.0" y="1034.944" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.92">num = max(existing keys, 9) + 1; runner = _plugin_runner; supports_lv=False</text>
<rect x="205" y="1082" width="590" height="68" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="1111.91" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">Copy benchmark scenario list</text>
<text x="500.0" y="1127.91" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.92">append plugin number if absent; dataclasses.replace(config, scenarios=...)</text>
<rect x="205" y="1176" width="590" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="1201.012" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">SCENARIO_REGISTRY[num] = spec</text>
<text x="500.0" y="1217.012" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.92">temporary process-global registration</text>
<rect x="205" y="1260" width="590" height="66" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="1288.808" text-anchor="middle" class="node-title" font-size="11.2" fill="#FFFFFF">try: run_benchmark(..., config_run)</text>
<text x="500.0" y="1304.808" text-anchor="middle" class="node-sub" font-size="8.1" fill="#FFFFFF" opacity="0.92">benchmark validates inputs, deep-copies net per scenario and dispatches plugin runner</text>
