name: Run Test Suite

on:
  push:
  pull_request:

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simbench_mvlv_rural:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pandapower simbench pvlib "oemof-demand>=0.2.2" workalendar
      - name: Run SimBench MVLV rural (retry)
        run: |
          set -e
          max=3
          for i in $(seq 1 $max); do
            echo "Attempt $i of $max..."
            python test_suite.py --only "MVLV-rural" && break
            if [ "$i" -lt "$max" ]; then
              echo "Retrying in 30s..."
              sleep 30
            else
              echo "All attempts failed."
              exit 1
            fi
          done

