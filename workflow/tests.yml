name: Run Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandapower simbench pvlib "oemof-demand>=0.2.2" workalendar

      - name: Run test suite
        run: python test_suite.py
