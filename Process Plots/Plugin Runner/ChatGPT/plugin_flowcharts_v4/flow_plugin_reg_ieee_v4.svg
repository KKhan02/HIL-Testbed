<text x="500.0" y="1399.91" text-anchor="middle" class="node-sub" font-size="8.1" fill="#FFFFFF" opacity="0.92">SCENARIO_REGISTRY.pop(num)</text>
<text x="500.0" y="1415.91" text-anchor="middle" class="node-sub" font-size="8.1" fill="#FFFFFF" opacity="0.92">if hw_fn exists: hw_fn.close() -&gt; Arduino END + port close</text>
