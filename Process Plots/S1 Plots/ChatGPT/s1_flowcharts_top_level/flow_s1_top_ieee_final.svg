<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1120" viewBox="0 0 820 1120"><title>Scenario 1 top-level baseline flow - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs><style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-hil{fill:none;stroke:#D85A30;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.8;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="34" y="26" width="752" height="1060" rx="20" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="2"/>
<text x="410.0" y="60" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">Scenario 1 - Top-Level Baseline Flow</text>
<rect x="195.0" y="92" width="430" height="64" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="410.0" y="120" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">run_scenario_1()</text>
<text x="410.0" y="139" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">network, profiles, voltage limits</text>
<rect x="195.0" y="190" width="430" height="90" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="410.0" y="218" text-anchor="middle" class="node-title" font-size="16.5" fill="#FFFFFF">Prepare time axis + profiles</text>
<text x="410.0" y="237" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">adapt_profiles(); on_scenario_start()</text>
<text x="410.0" y="254" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">integer-index DER/load tables; validate all time steps</text>
<rect x="195.0" y="316" width="430" height="66" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="410.0" y="344" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Reset network state</text>
<text x="410.0" y="363" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">drop stale controllers; pp.reset_results()</text>
<rect x="195.0" y="418" width="430" height="88" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="410.0" y="446" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Attach profile-driven ConstControl</text>
<text x="410.0" y="465" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">sgen p_mw if DER profiles exist</text>
<text x="410.0" y="482" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">load p_mw + q_mvar if load profiles exist</text>
<rect x="195.0" y="542" width="430" height="82" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="410.0" y="570" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Configure OutputWriter</text>
<text x="410.0" y="589" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">log V, line/trafo loading, losses, ext_grid P</text>
<rect x="195.0" y="664" width="430" height="94" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="410.0" y="692" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Annual sweep + post-processing pass</text>
<text x="410.0" y="711" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">run_timeseries() owns the PF sweep</text>
<text x="410.0" y="728" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">then convert logged tables to records; see Diagram 2</text>
<rect x="195.0" y="800" width="430" height="76" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="410.0" y="828" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="410.0" y="847" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">aggregate all baseline records</text>
<rect x="195.0" y="916" width="430" height="66" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="410.0" y="944" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">on_scenario_end()</text>
<text x="410.0" y="963" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">close publisher handle; final live event</text>
<rect x="195.0" y="1020" width="430" height="48" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="410.0" y="1050.0" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">return ScenarioResult</text>
