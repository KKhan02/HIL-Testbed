<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1230" viewBox="0 0 800 1230">
<title>Scenario 3 top-level SVC flow - IEEE</title>
<defs>
  <marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
  <marker id="arrowWhite" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#FFFFFF"/></marker>
  <marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
  <marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
  <marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
  <marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
.node-title { font-weight:700; } .node-sub { font-weight:400; }
.edge-dark { fill:none; stroke:#263238; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-white { fill:none; stroke:#FFFFFF; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-hil { fill:none; stroke:#D85A30; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-gate { fill:none; stroke:#7A5C12; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-loop { fill:none; stroke:#3D8FD9; stroke-width:2.8; stroke-dasharray:7 5; stroke-linejoin:round; stroke-linecap:round; }
.edge-assoc { fill:none; stroke:#8A887F; stroke-width:2.0; stroke-dasharray:6 4; stroke-linejoin:round; stroke-linecap:round; }
</style>
<rect x="34" y="26" width="732" height="1172" rx="20" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="2"/>
<text x="400.0" y="60" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">Scenario 3 - Top-Level SVC Flow</text>
<rect x="205.0" y="88" width="390" height="64" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="400.0" y="116" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">run_scenario_3()</text>
<text x="400.0" y="135" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">network, profiles, voltage limits</text>
<rect x="205.0" y="184" width="390" height="82" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="400.0" y="212" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Prepare simulation</text>
<text x="400.0" y="231" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">adapt_profiles(); publisher start</text>
<text x="400.0" y="248" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">load checkpoint -&gt; start_t</text>
<polygon points="400,286.0 510.0,326 400,366.0 290.0,326" fill="#854F0B"/>
<text x="400" y="331" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">checkpoint covers all T?</text>
<rect x="205.0" y="410" width="390" height="102" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="400.0" y="438" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Prepare SVC</text>
<text x="400.0" y="457" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">reset controllers/results; compute Q_MAX + k_q</text>
<text x="400.0" y="474" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">select fixed MV bus; create SVC sgen</text>
<rect x="205.0" y="550" width="390" height="78" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="400.0" y="578" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Per-timestep SVC loop</text>
<text x="400.0" y="597" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">pre-PF -&gt; droop -&gt; optional post-PF</text>
<text x="400.0" y="614" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">record / publish; see Diagram 2</text>
<rect x="205.0" y="666" width="390" height="72" rx="14" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="400.0" y="694" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">finally: remove SVC</text>
<text x="400.0" y="713" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">drop temporary sgen; reset_results()</text>
<rect x="35" y="284" width="155" height="84" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="112.5" y="312" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">Recompute metadata</text>
<text x="112.5" y="331" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">Q_MAX + k_q</text>
<text x="112.5" y="348" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">select SVC bus</text>
<circle cx="400" cy="800" r="14" fill="#5F5E5A"/>
<rect x="205.0" y="846" width="390" height="74" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="400.0" y="874" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="400.0" y="893" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">svc_bus + svc_q_max</text>
<rect x="205.0" y="956" width="390" height="66" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="400.0" y="984" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">on_scenario_end()</text>
<text x="400.0" y="1003" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">close checkpoint; final live event</text>
<rect x="205.0" y="1058" width="390" height="48" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="400.0" y="1088.0" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">return ScenarioResult</text>
<path d="M400 152 L400 182" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 266 L400 284" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 366 L400 408" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="414" y="385.0" text-anchor="start" fill="#111111" font-size="11" font-weight="700">no / resume</text>
<path d="M400 512 L400 548" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 628 L400 664" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 738 L400 784" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M290 326 L192 326" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="278.0" y="316" text-anchor="end" fill="#7A5C12" font-size="11" font-weight="700">yes - skip loop</text>
<path d="M112.5 368 L112.5 800 L384 800" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M400 814 L400 844" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 920 L400 954" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M400 1022 L400 1056" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>