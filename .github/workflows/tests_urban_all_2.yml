name: Run MVLV urban all-2 cases

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  simbench_mvlv_urban_all_2_sw:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pandapower simbench pvlib "oemof-demand>=0.2.2" workalendar
      - name: Add swap (8 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Run MVLV urban all-2 sw
        run: /usr/bin/time -v python test_suite.py --only "1-MVLV-urban-all-2-sw" --verbose

  simbench_mvlv_urban_all_2_no_sw:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pandapower simbench pvlib "oemof-demand>=0.2.2" workalendar
      - name: Add swap (8 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Run MVLV urban all-2 no_sw
        run: /usr/bin/time -v python test_suite.py --only "1-MVLV-urban-all-2-no_sw" --verbose
