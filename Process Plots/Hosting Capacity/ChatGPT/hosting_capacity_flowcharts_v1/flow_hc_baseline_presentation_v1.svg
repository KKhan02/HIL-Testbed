<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Hosting capacity baseline sweep - presentation</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="155" y="20" width="710" height="46" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="510.0" y="38.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">run_baseline_hc: isolate net + configure deterministic HC sweep</text>
<text x="510.0" y="54.638" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">voltage-only worst-case snapshot analysis</text>
<rect x="135" y="88" width="750" height="58" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="510.0" y="112.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">Infer voltage class + end-of-feeder; set worst-case snapshot</text>
<text x="510.0" y="128.298" text-anchor="middle" class="node-sub" font-size="6.7" fill="#FFFFFF" opacity="0.92">10% load; existing in-service generation at inferred rated P; Q reset to zero</text>
<path d="M510 66 L510 86" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="510,184.0 635.0,205 510,226.0 385.0,205" fill="#854F0B"/>
<text x="510" y="208.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">within HC sweep bound?</text>
<path d="M510 146 L510 182" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="720" y="183" width="260" height="44" rx="8" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="850.0" y="199.788" text-anchor="middle" class="node-title" font-size="8.2" fill="#FFFFFF">No violation before loop exhaustion</text>
<text x="850.0" y="215.788" text-anchor="middle" class="node-sub" font-size="5.9" fill="#FFFFFF" opacity="0.92">set hc_limit_reached</text>
<path d="M635 205 L718 205" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="677.5" y="198" text-anchor="middle" fill="#7A5C12" font-size="7.5" font-weight="700">no</text>
<rect x="300" y="260" width="420" height="50" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="510.0" y="279.992" text-anchor="middle" class="node-title" font-size="8.8" fill="#FFFFFF">Add one PV step at end-of-feeder</text>
<text x="510.0" y="295.992" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">increment total_mw; new sgen starts at Q=0</text>
<path d="M510 226 L510 258" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="520" y="237.0" text-anchor="start" fill="#7A5C12" font-size="7.5" font-weight="700">yes</text>
<rect x="300" y="335" width="420" height="48" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="510.0" y="353.992" text-anchor="middle" class="node-title" font-size="8.8" fill="#FFFFFF">runpp -&gt; detect_violations</text>
<text x="510.0" y="369.992" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">PF exception is treated as a violating step</text>
<path d="M510 310 L510 333" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="510,425.0 625.0,445 510,465.0 395.0,445" fill="#854F0B"/>
<text x="510" y="448.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">violating step?</text>
<path d="M510 383 L510 423" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="45" y="422" width="270" height="46" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="180.0" y="439.754" text-anchor="middle" class="node-title" font-size="8.1" fill="#FFFFFF">Record first violation / PF failure</text>
<text x="180.0" y="455.754" text-anchor="middle" class="node-sub" font-size="5.9" fill="#FFFFFF" opacity="0.92">drop the last-added PV and stop sweep</text>
<path d="M395 445 L317 445" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="355.0" y="438" text-anchor="middle" fill="#D85A30" font-size="7.4" font-weight="700">yes</text>
<rect x="300" y="505" width="420" height="48" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="510.0" y="523.992" text-anchor="middle" class="node-title" font-size="8.8" fill="#FFFFFF">Accept step as current hosting capacity</text>
<text x="510.0" y="539.992" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">hc_mw=total_mw; append sweep point</text>
<path d="M510 465 L510 503" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="520" y="476.0" text-anchor="start" fill="#111111" font-size="7.4" font-weight="700">no</text>
<path d="M300 529 L12 529 L12 205 L383 205" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="20" y="521.0" text-anchor="start" fill="#3D8FD9" font-size="7.2" font-weight="700">next PV step</text>
<circle cx="510" cy="610" r="9" fill="#5F5E5A"/>
<path d="M180 468 L180 610 L499 610" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M850 227 L850 610 L521 610" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="210" y="645" width="600" height="62" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="510.0" y="671.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">Return HCResult + last violation-free network</text>
<text x="510.0" y="687.23" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">first violating baseline increment has been removed</text>
<path d="M510 619 L510 643" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="310" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="658" width="800" height="380" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Deterministic HC setup</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Both HC cases operate on a deep copy, so the network supplied by the benchmark runner is not modified.</text>
<text x="1104" y="136" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The distribution level is inferred from the modal bus voltage: &gt;1 kV selects MV parameters and &lt;=1 kV selects LV parameters.</text>
<text x="1104" y="178" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The end-of-feeder target is the reachable distribution-level bus with the greatest topological distance from the slack.</text>
<text x="1104" y="220" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Before the sweep, load P/Q is reduced to 10% and existing in-service generators are placed at inferred rated active power.</text>
<text x="1104" y="262" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The analysis evaluates voltage violations only; every power flow forces voltage-dependent loads off and uses Newton-Raphson.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Incremental baseline sweep</text>
<text x="1104" y="396" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Each iteration adds one PV sgen at the same end-of-feeder bus and increases total_mw by the MV or LV step size.</text>
<text x="1104" y="439" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">A solved snapshot is passed to detect_violations; a power-flow exception is handled as a violating step.</text>
<text x="1104" y="482" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">The first violating step records the binding voltage location and is removed from the returned baseline network.</text>
<text x="1104" y="525" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Every clean step becomes the latest hosting capacity and contributes one {mw, max_vm_pu} point to sweep_curve.</text>
<text x="1104" y="568" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">If the loop finishes without a violating step, hc_limit_reached is set and the last accepted capacity is retained.</text>
<text x="1104" y="691" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Result semantics</text>
<text x="1104" y="728" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">HCResult stores hc_mw, the first violating MW level, binding bus/voltage, step count, sweep limit status and sweep curve.</text>
<text x="1104" y="782" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Baseline HC additionally returns the deep-copied network at the last accepted PV capacity for downstream stressed analysis.</text>
<text x="1104" y="836" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">MV uses 0.5 MW increments up to the configured 20 MW bound; LV uses 0.01 MW increments up to 0.5 MW.</text>
<text x="1104" y="890" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">No Monte Carlo placement or annual QSTS is performed here; this module implements the deterministic snapshot method.</text>
</svg>