<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>HIL CLI top-level entry - presentation</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="155" y="22" width="690" height="46" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="40.808" text-anchor="middle" class="node-title" font-size="11.2" fill="#FFFFFF">HIL CLI entry (__main__.main)</text>
<text x="500.0" y="56.808" text-anchor="middle" class="node-sub" font-size="7.5" fill="#FFFFFF" opacity="0.92">start one configured benchmark run</text>
<polygon points="500,129.0 622.5,150 500,171.0 377.5,150" fill="#854F0B"/>
<text x="500" y="153.468" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">load saved preset?</text>
<path d="M500 68 L500 127" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="700" y="126" width="260" height="48" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="830.0" y="144.992" text-anchor="middle" class="node-title" font-size="8.8" fill="#FFFFFF">Load + validate preset</text>
<text x="830.0" y="160.992" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">JSON -&gt; RunPlan; warnings may cancel</text>
<path d="M622.5 150 L698 150" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="661.25" y="143" text-anchor="middle" fill="#7A5C12" font-size="7.6" font-weight="700">yes</text>
<polygon points="500,240.0 610.0,260 500,280.0 390.0,260" fill="#854F0B"/>
<text x="500" y="263.264" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">usable plan loaded?</text>
<path d="M500 171 L500 238" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="511" y="183.0" text-anchor="start" fill="#111111" font-size="7.6" font-weight="700">no</text>
<path d="M830 174 L830 260 L612 260" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="230" y="310" width="540" height="54" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="332.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">Run 9-step wizard</text>
<text x="500.0" y="348.23" text-anchor="middle" class="node-sub" font-size="6.8" fill="#FFFFFF" opacity="0.92">used when no preset was selected or loading was cancelled</text>
<path d="M500 280 L500 308" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="511" y="292.0" text-anchor="start" fill="#7A5C12" font-size="7.6" font-weight="700">no</text>
<circle cx="500" cy="400" r="8" fill="#5F5E5A"/>
<path d="M500 364 L500 390" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 260 L180 260 L180 400 L490 400" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="366.0" y="253" text-anchor="end" fill="#7A5C12" font-size="7.5" font-weight="700">yes</text>
<rect x="200" y="445" width="600" height="56" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="468.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">Preview RunPlan</text>
<text x="500.0" y="484.298" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">terminal tables for run, dataset, network and limits</text>
<path d="M500 408 L500 443" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="500,550.0 600.0,570 500,590.0 400.0,570" fill="#854F0B"/>
<text x="500" y="573.332" text-anchor="middle" class="node-title" font-size="9.8" fill="#FFFFFF">proceed?</text>
<path d="M500 501 L500 548" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="70" y="549" width="220" height="42" rx="8" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="180.0" y="564.958" text-anchor="middle" class="node-title" font-size="8.7" fill="#FFFFFF">Cancel</text>
<text x="180.0" y="580.958" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">exit 0</text>
<path d="M400 570 L292 570" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="345.0" y="564" text-anchor="middle" fill="#111111" font-size="7.4" font-weight="700">no</text>
<polygon points="500,680.0 607.5,700 500,720.0 392.5,700" fill="#854F0B"/>
<text x="500" y="703.264" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">save preset?</text>
<path d="M500 590 L500 678" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="510" y="600.0" text-anchor="start" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<rect x="700" y="679" width="245" height="42" rx="8" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="822.5" y="694.754" text-anchor="middle" class="node-title" font-size="8.1" fill="#FFFFFF">Attempt preset save</text>
<text x="822.5" y="710.754" text-anchor="middle" class="node-sub" font-size="5.8" fill="#FFFFFF" opacity="0.92">non-empty name -&gt; presets/&lt;name&gt;.json</text>
<path d="M607.5 700 L698 700" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="653.75" y="694" text-anchor="middle" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<circle cx="500" cy="780" r="8" fill="#5F5E5A"/>
<path d="M500 720 L500 770" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510" y="730.0" text-anchor="start" fill="#111111" font-size="7.4" font-weight="700">no</text>
<path d="M822.5 721 L822.5 780 L510 780" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="255" y="825" width="490" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="849.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">try: executor.execute(plan)</text>
<text x="500.0" y="865.23" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">runtime validation, network/profile resolution, benchmark and publishing</text>
<path d="M500 788 L500 823" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="20" y="830" width="185" height="48" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="112.5" y="848.618" text-anchor="middle" class="node-title" font-size="7.7" fill="#FFFFFF">KeyboardInterrupt</text>
<text x="112.5" y="864.618" text-anchor="middle" class="node-sub" font-size="5.5" fill="#FFFFFF" opacity="0.92">outer safety net -&gt; exit 130</text>
<path d="M255 854 L207 854" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="230.0" y="848.0" text-anchor="middle" fill="#D85A30" font-size="6.9" font-weight="700">interrupt</text>
<rect x="795" y="828" width="215" height="52" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="902.5" y="848.686" text-anchor="middle" class="node-title" font-size="7.9" fill="#FFFFFF">Unexpected wrapper error</text>
<text x="902.5" y="864.686" text-anchor="middle" class="node-sub" font-size="5.7" fill="#FFFFFF" opacity="0.92">print error -&gt; exit 1</text>
<path d="M745 854 L793 854" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="770.0" y="848.0" text-anchor="middle" fill="#D85A30" font-size="6.9" font-weight="700">exception</text>
<rect x="250" y="950" width="500" height="52" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="971.026" text-anchor="middle" class="node-title" font-size="8.9" fill="#FFFFFF">Process exits with executor ExitCode</text>
<text x="500.0" y="987.026" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">normal return -&gt; sys.exit(code); typed codes 0, 2-8 or 130</text>
<path d="M500 883 L500 948" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510.0" y="894" text-anchor="start" fill="#111111" font-size="7.0" font-weight="700">normal return</text>
<rect x="1080" y="26" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="330" width="800" height="315" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="669" width="800" height="365" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="60" text-anchor="start" fill="#111111" font-size="17" font-weight="700">RunPlan acquisition</text>
<text x="1104" y="98" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">The CLI can reconstruct a saved RunPlan or collect a new one interactively through the wizard.</text>
<text x="1104" y="146" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">Saved presets are structurally rebuilt with RunPlan.from_dict and then checked against the current network/plugin paths.</text>
<text x="1104" y="194" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">A rejected, missing or unreadable preset does not terminate the CLI; control falls back to the wizard.</text>
<text x="1104" y="242" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">The RunPlan is the single configuration object passed into the executor.</text>
<text x="1104" y="364" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Confirmation and persistence</text>
<text x="1104" y="402" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The selected configuration is rendered as terminal tables before any network or profile loading occurs.</text>
<text x="1104" y="451" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The user can cancel with exit code 0 or continue to execution.</text>
<text x="1104" y="500" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Saving a preset is optional; an empty preset name simply leaves the RunPlan unsaved.</text>
<text x="1104" y="549" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Runtime reproducibility is additionally handled by the executor, which writes a copy of the RunPlan into the run output directory.</text>
<text x="1104" y="703" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Executor boundary</text>
<text x="1104" y="742" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">__main__ delegates runtime work to executor.execute(plan) rather than loading networks or running scenarios itself.</text>
<text x="1104" y="800" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">A normal executor return is passed directly to sys.exit, preserving the executor&#x27;s typed process status.</text>
<text x="1104" y="858" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">KeyboardInterrupt caught by the outer safety net exits with 130; an unexpected wrapper-layer exception is reported and exits with 1.</text>
</svg>