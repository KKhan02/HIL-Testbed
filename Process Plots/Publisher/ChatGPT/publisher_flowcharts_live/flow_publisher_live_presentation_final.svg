<text x="382.0" y="667" text-anchor="end" fill="#D85A30" font-size="10" font-weight="700">no</text>
<path d="M610 674 L678 674" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="618.0" y="667" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">yes</text>
<path d="M385 618 L46 618 L46 744 L486 744" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="377.0" y="611" text-anchor="end" fill="#7A5C12" font-size="10" font-weight="700">no -&gt; return</text>
