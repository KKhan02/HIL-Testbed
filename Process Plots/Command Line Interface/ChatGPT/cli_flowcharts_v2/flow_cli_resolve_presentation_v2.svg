<text x="520.0" y="965.162" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">one executor contract for plugin and non-plugin paths</text>
<path d="M520 893 L520 923" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="320" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="668" width="800" height="370" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Network resolution</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Non-plugin network resolution follows three real source branches: preset loader, assembled SimBench code, or a custom Python factory.</text>
<text x="1104" y="141" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Custom Python networks are imported from the configured file and must return an object with pandapower bus/line/load/sgen tables.</text>
<text x="1104" y="188" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Network-plugin YAML is different: load_network_from_yaml returns net + profiles, then make_profile_factory creates the same-strategy rebuild callable.</text>
<text x="1104" y="235" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Plugin compatibility warnings are shown before execution and require explicit confirmation when any are present.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Dataset resolution</text>
<text x="1104" y="396" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Only non-plugin networks enter dataset dispatch: SimBench native, DWD, or a custom data directory with optional file/column maps.</text>
<text x="1104" y="446" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">SimBench-native profiles require an available SimBench code; DWD performs a directory/station pre-check; custom requires custom_path to be a directory.</text>
<text x="1104" y="496" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">All three feed profile_builder.build_annual_profiles and create a closure that can rebuild profiles for a later HC-stressed network.</text>
<text x="1104" y="546" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Plugin networks skip this dataset dispatch because their YAML strategy already constructed the initial profile set.</text>
<text x="1104" y="701" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Post-build consistency</text>
<text x="1104" y="738" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">User-requested DER injections and switch flips are applied before profile construction or any required plugin-profile rebuild.</text>
<text x="1104" y="790" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Load/DER scaling changes both network tables and matching profile columns; the selected time window is then applied.</text>
<text x="1104" y="842" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">timestep_resolution is checked against the actual profile spacing and warns on mismatch; focus_buses are validated against the loaded net.</text>
<text x="1104" y="894" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Both paths return the same four values to the benchmark-configuration phase.</text>
</svg>