<text x="805.0" y="923.196" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.92">aggregate fields from stored summary</text>
<path d="M595 912 L678 912" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="630.0" y="905" text-anchor="middle" fill="#111111" font-size="8.5" font-weight="700">yes</text>
<circle cx="480" cy="964" r="9" fill="#5F5E5A"/>
<path d="M480 933 L480 953" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="492" y="946.0" text-anchor="start" fill="#111111" font-size="8.5" font-weight="700">no</text>
<path d="M805 936 L805 964 L491 964" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="480,999.0 575.0,1018 480,1037.0 385.0,1018" fill="#854F0B"/>
