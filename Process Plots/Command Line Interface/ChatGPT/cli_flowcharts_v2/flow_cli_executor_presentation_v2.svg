<text x="520.0" y="995.992" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">0 success; 7 scenario failures; 8 publishing failure; 130 publishing interruption</text>
<path d="M520 933 L520 958" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="325" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="675" width="800" height="363" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Pre-run safeguards</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Validation occurs before a potentially multi-hour run: cross-field constraints, file paths, dataset/network compatibility and serial availability are checked early.</text>
<text x="1104" y="141" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Per-run Q(V) values are applied through volt_var_controller.set_qv_parameters so software, coordinator sizing and Arduino CFG use the same characteristic.</text>
<text x="1104" y="188" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Violation-detector thresholds are reset then rebound for the run, keeping default-driven checks consistent with the selected limits.</text>
<text x="1104" y="235" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Hardware is probe-opened only when the chosen scenario set or custom controller will actually use the serial interface.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Run and publication semantics</text>
<text x="1104" y="396" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Network/profile resolution is isolated as its own phase and returns the HC profile factory needed for stressed re-benchmarking.</text>
<text x="1104" y="446" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Topology/profile publication before simulation is intentionally non-fatal, so an export problem does not prevent the benchmark from starting.</text>
<text x="1104" y="496" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">A controller plugin routes Phase 3 through register_and_run; otherwise the executor invokes run_benchmark directly.</text>
<text x="1104" y="546" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">A Phase-3 failure or interruption returns immediately; Phase-4 publication problems instead preserve the completed result and continue through the final summary.</text>
<text x="1104" y="708" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Typed process status</text>
<text x="1104" y="745" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">CONFIG, NETWORK, DATASET, PLUGIN and HARDWARE failures terminate in their guarded pre-run phases with their typed process status.</text>
<text x="1104" y="797" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Phase-3 controller-definition/import failures map to PLUGIN_ERROR; runtime crashes map to SIMULATION_ERROR; interruption returns 130 immediately.</text>
<text x="1104" y="849" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Publishing exceptions set PUBLISH_ERROR and publishing interruption sets 130, but both still allow the completed benchmark summary to be printed.</text>
<text x="1104" y="901" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">If publishing remained OK but benchmark_runner reports real scenario failures, the final post-run status is promoted from OK to SIMULATION_ERROR.</text>
</svg>