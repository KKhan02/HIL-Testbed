<text x="957.5" y="369.5" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">compact full timeseries</text>
<rect x="115.0" y="508" width="700" height="54" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="465.0" y="531.5" text-anchor="middle" class="node-title" font-size="20" fill="#FFFFFF">All scenarios + HC complete</text>
<text x="465.0" y="550.5" text-anchor="middle" class="node-sub" font-size="13.5" fill="#FFFFFF" opacity="0.90">final summary write point</text>
