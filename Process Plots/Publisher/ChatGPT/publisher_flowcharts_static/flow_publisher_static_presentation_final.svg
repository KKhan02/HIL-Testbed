<rect x="1140" y="26" width="740" height="300" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1140" y="346" width="740" height="310" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1140" y="676" width="740" height="360" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1162" y="58" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Three independent static write points</text>
<text x="1162" y="96" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">1. Network-load time: topology.json and profiles.json are written before scenario execution.</text>
<text x="1162" y="135" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">2. Scenario-loop time: each successful ScenarioResult is written immediately to scenarios/&lt;sid&gt;.json.</text>
<text x="1162" y="174" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">3. Post-run time: HC and comparison payloads are written after the scenario loop and HC analysis.</text>
<text x="1162" y="213" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">The old monolithic publish_result() flow is no longer present in the current publisher.py.</text>
<text x="1162" y="252" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Splitting the writes improves crash resilience and avoids one large end-of-run write burst.</text>
<text x="1162" y="380" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Payload-builder responsibilities</text>
<text x="1162" y="418" text-anchor="start" fill="#111111" font-size="11.9" font-weight="600">build_topology(): buses, lines, trafos, sgens, loads, feeder distance and voltage limits.</text>
<text x="1162" y="460" text-anchor="start" fill="#111111" font-size="11.9" font-weight="600">build_profiles_payload(): full-resolution and hourly load/PV/wind totals plus per-element series.</text>
<text x="1162" y="502" text-anchor="start" fill="#111111" font-size="11.9" font-weight="600">build_scenario_payload(): summary plus per-timestep network, violation, control and energy fields.</text>
<text x="1162" y="544" text-anchor="start" fill="#111111" font-size="11.9" font-weight="600">build_hc_payload(): baseline/Volt-Var HC summaries, gain and stored sweep-curve data.</text>
<text x="1162" y="586" text-anchor="start" fill="#111111" font-size="11.9" font-weight="600">_dump() performs JSON-safe serialization and creates parent directories as needed.</text>
<text x="1162" y="710" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Output/file semantics</text>
<text x="1162" y="748" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">topology.json and profiles.json are system-level files.</text>
<text x="1162" y="793" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">scenarios/&lt;sid&gt;.json is written compactly (indent=None) because annual payloads can be very large.</text>
<text x="1162" y="838" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">publish_scenario_result(None) returns None and writes nothing.</text>
<text x="1162" y="883" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">hc.json is omitted when hc_results is empty; comparison.json is omitted when the DataFrame is empty.</text>
<text x="1162" y="928" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">The HC-stressed re-benchmark uses a separate output directory and repeats the same static write lifecycle.</text>
</svg>