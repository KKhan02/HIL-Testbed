<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1430" viewBox="0 0 920 1430"><title>Scenario 1 annual sweep and post-processing - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs><style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil{fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="892" height="1402" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="460.0" y="36" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Scenario 1 - Annual Sweep + Post-Processing</text>
<rect x="230" y="66" width="460" height="58" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="86" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">[4] ts.run_timeseries()</text>
<text x="460.0" y="101" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">continue_on_divergence=True; run=_timed_runpp</text>
<rect x="90" y="150" width="740" height="440" rx="16" fill="none" stroke="#8A887F" stroke-width="1.0"/>
<text x="106" y="144" text-anchor="start" fill="#111111" font-size="10.5" font-weight="700">Phase A - pandapower run_timeseries sweep</text>
<polygon points="460,172.0 545.0,196 460,220.0 375.0,196" fill="#5F5E5A"/>
<text x="460" y="192" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">for each engine t</text>
<path d="M460 124 L460 170" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="240" y="244" width="440" height="60" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="264" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">ConstControl writes profile values</text>
<text x="460.0" y="279" text-anchor="middle" class="node-sub" font-size="8.7" fill="#FFFFFF" opacity="0.90">sgen p_mw; load p_mw / q_mvar from DFData[t]</text>
<path d="M460 220 L460 242" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="240" y="334" width="440" height="60" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="354" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">_timed_runpp() -&gt; pp.runpp()</text>
<text x="460.0" y="369" text-anchor="middle" class="node-sub" font-size="8.7" fill="#FFFFFF" opacity="0.90">record elapsed ms keyed by OutputWriter.time_step</text>
<path d="M460 304 L460 332" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="240" y="424" width="440" height="72" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="460.0" y="444" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">OutputWriter logs settled result tables</text>
<text x="460.0" y="459" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">vm_pu; line/trafo loading; line/trafo losses</text>
<text x="460.0" y="472" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">ext_grid p_mw</text>
<path d="M460 394 L460 422" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="460,524.0 555.0,548 460,572.0 365.0,548" fill="#854F0B"/>
<text x="460" y="552" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">more engine timesteps?</text>
<path d="M460 496 L460 522" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M365 548 L42 548 L42 196 L373 196" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="357.0" y="541" text-anchor="end" fill="#3D8FD9" font-size="10" font-weight="700">yes</text>
<rect x="230" y="628" width="460" height="72" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="648" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">Read OutputWriter logs</text>
<text x="460.0" y="663" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">vm_log / loading / losses / grid import tables</text>
<path d="M460 572 L460 604 L460 626" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="470" y="589.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">no - sweep complete</text>
<rect x="90" y="738" width="740" height="664" rx="16" fill="none" stroke="#8A887F" stroke-width="1.0"/>
<text x="106" y="732" text-anchor="start" fill="#111111" font-size="10.5" font-weight="700">Phase B - run_scenario_1() post-processing loop</text>
<polygon points="460,766.0 545.0,790 460,814.0 375.0,790" fill="#5F5E5A"/>
<text x="460" y="786" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">for each logged t</text>
<path d="M460 700 L460 764" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="460,852.0 570.0,882 460,912.0 350.0,882" fill="#854F0B"/>
<text x="460" y="886" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">logged timestep converged?</text>
<path d="M460 814 L460 850" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="88" y="844" width="220" height="76" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="198.0" y="864" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">Non-converged logged row</text>
<text x="198.0" y="879" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">empty V/loading; losses/import=None</text>
<text x="198.0" y="892" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">append failed record; no publish</text>
<path d="M350 882 L310 882" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="342.0" y="874" text-anchor="end" fill="#D85A30" font-size="10" font-weight="700">no</text>
<rect x="210" y="948" width="500" height="78" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="460.0" y="968" text-anchor="middle" class="node-title" font-size="11.2" fill="#FFFFFF">Read converged row + threshold violations</text>
<text x="460.0" y="983" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">drop NaNs; V outside limits; line/trafo loading above limits</text>
<text x="460.0" y="996" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">derive losses, grid import, DER generation, load</text>
<path d="M460 912 L460 946" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="470" y="930.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<rect x="210" y="1060" width="500" height="74" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="460.0" y="1080" text-anchor="middle" class="node-title" font-size="11.3" fill="#FFFFFF">Build converged TimestepRecord</text>
<text x="460.0" y="1095" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">publish_fn.on_timestep(rec) -&gt; records.append(rec)</text>
<text x="460.0" y="1108" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">t_total_ms from _RUNPP_TIMING[t]</text>
<path d="M460 1026 L460 1058" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M460 1134 L460 1168" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M88 882 L58 882 L58 1182 L446 1182" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="460" cy="1182" r="12" fill="#5F5E5A"/>
<polygon points="460,1226.0 555.0,1250 460,1274.0 365.0,1250" fill="#854F0B"/>
<text x="460" y="1254" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">more logged timesteps?</text>
<path d="M460 1194 L460 1224" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M365 1250 L34 1250 L34 790 L373 790" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="357.0" y="1243" text-anchor="end" fill="#3D8FD9" font-size="10" font-weight="700">yes</text>
<rect x="580" y="1228" width="250" height="44" rx="9" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="705.0" y="1248" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">post-processing complete</text>
<text x="705.0" y="1263" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">return records to top-level finalization</text>
<path d="M555 1250 L578 1250" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="563.0" y="1243" text-anchor="start" fill="#111111" font-size="10" font-weight="700">no</text>
</svg>