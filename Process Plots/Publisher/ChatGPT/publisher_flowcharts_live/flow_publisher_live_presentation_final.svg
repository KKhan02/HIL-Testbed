<text x="397.0" y="787" text-anchor="end" fill="#3D8FD9" font-size="10" font-weight="700">no</text>
<rect x="170" y="824" width="660" height="44" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="843.5" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">on_scenario_end(result)</text>
<text x="500.0" y="858.5" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">close checkpoint; persist elapsed; append scenario_complete live event</text>
<path d="M500 811 L500 822" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510" y="825.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<rect x="170" y="894" width="660" height="40" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="911.5" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">benchmark_runner writes scenarios/&lt;sid&gt;.json</text>
<text x="500.0" y="926.5" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">publish_scenario_result(result)</text>
<path d="M500 868 L500 892" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="170" y="960" width="660" height="44" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="979.5" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">Archive checkpoint as .jsonl.completed</text>
<text x="500.0" y="994.5" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">final scenario JSON is confirmed before rename</text>
<path d="M500 934 L500 958" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1100" y="24" width="780" height="288" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1100" y="334" width="780" height="314" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1100" y="670" width="780" height="358" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1122" y="56" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Two independent JSONL streams</text>
<text x="1122" y="94" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">live/&lt;sid&gt;.jsonl: dashboard-only compact frames; always truncated at on_scenario_start().</text>
<text x="1122" y="133" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">checkpoint/&lt;sid&gt;.jsonl: full TimestepRecord serialization; opened in append mode and never truncated by PublishHandle.</text>
<text x="1122" y="172" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">update_every_k affects only live dashboard frames. Checkpoint writes occur on every on_timestep() callback.</text>
<text x="1122" y="211" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">.elapsed stores cumulative wall-clock time across crash/restart attempts.</text>
<text x="1122" y="250" text-anchor="start" fill="#111111" font-size="12.0" font-weight="600">cumulative_elapsed_s() = prior persisted elapsed + current attempt runtime.</text>
<text x="1122" y="368" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Resume and completion semantics</text>
<text x="1122" y="406" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">get_resume_records() first checks checkpoint/&lt;sid&gt;.jsonl, then .jsonl.completed if the live path is absent.</text>
<text x="1122" y="450" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">Valid JSONL rows are reconstructed with TimestepRecord.from_checkpoint_dict().</text>
<text x="1122" y="494" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">Corrupt or partial lines are skipped, which protects against a crash during the final append.</text>
<text x="1122" y="538" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">After a successful runner return, benchmark_runner writes the final scenario JSON and then renames the checkpoint to .completed.</text>
<text x="1122" y="582" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">Layer 1 resume in benchmark_runner can skip the runner entirely when scenarios/&lt;sid&gt;.json already exists and loads correctly.</text>
<text x="1122" y="704" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Runner-integration caveats</text>
<text x="1122" y="742" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">PublishHandle can only checkpoint records that a scenario runner actually passes to on_timestep().</text>
<text x="1122" y="791" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">S2/S3 pre-PF failure branches append failed records directly and therefore skip publisher checkpoint/live callbacks for those steps.</text>
<text x="1122" y="840" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">S1 accepts the publisher handle but does not call get_resume_records(), so crash-resume is not implemented for its run_timeseries sweep.</text>
<text x="1122" y="889" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">S2-S5 call on_scenario_start() before get_resume_records(); partial resumes continue from the last recovered record.</text>
<text x="1122" y="938" text-anchor="start" fill="#111111" font-size="11.8" font-weight="600">on_scenario_end() closes the open checkpoint handle before appending the terminal live event.</text>
</svg>