<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1330" viewBox="0 0 880 1330"><title>profile_builder SimBench native profile path - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowRed" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#993C1D"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-red{fill:none;stroke:#993C1D;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="18" y="18" width="844" height="1294" rx="18" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.6"/>
<text x="440.0" y="48" text-anchor="middle" fill="#111111" font-size="20" font-weight="700">profile_builder - SimBench Native Profile Path</text>
<rect x="215.0" y="78" width="450" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="440.0" y="104.5" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">build_annual_profiles()</text>
<text x="440.0" y="119.5" text-anchor="middle" class="node-sub" font-size="10.5" fill="#FFFFFF" opacity="0.90">net, net_name, simbench_code</text>
<polygon points="440,159.0 565.0,190 440,221.0 315.0,190" fill="#854F0B"/>
<text x="440" y="194" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">net_type == &#x27;simbench&#x27;?</text>
<rect x="42" y="159" width="150" height="62" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="117.0" y="187.5" text-anchor="middle" class="node-title" font-size="11" fill="#FFFFFF">No</text>
<text x="117.0" y="202.5" text-anchor="middle" class="node-sub" font-size="8.7" fill="#FFFFFF" opacity="0.90">use fallback path</text>
<polygon points="440,255.0 565.0,286 440,317.0 315.0,286" fill="#854F0B"/>
<text x="440" y="290" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">simbench_code provided?</text>
<rect x="688" y="255" width="150" height="62" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="763.0" y="283.5" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">Raise ValueError</text>
<text x="763.0" y="298.5" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">code is required</text>
<rect x="215.0" y="354" width="450" height="88" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="440.0" y="382.5" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">Load SimBench profile source</text>
<text x="440.0" y="397.5" text-anchor="middle" class="node-sub" font-size="9.2" fill="#FFFFFF" opacity="0.90">raw_net = get_simbench_net(code)</text>
<text x="440.0" y="410.5" text-anchor="middle" class="node-sub" font-size="9.2" fill="#FFFFFF" opacity="0.90">profiles = get_absolute_values(...profiles=True)</text>
<text x="440.0" y="423.5" text-anchor="middle" class="node-sub" font-size="9.2" fill="#FFFFFF" opacity="0.90">times = profiles[(load,p_mw)].index</text>
<polygon points="440,478.0 580.0,510 440,542.0 300.0,510" fill="#854F0B"/>
<text x="440" y="514" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">profile index is DatetimeIndex?</text>
<rect x="78" y="480" width="200" height="60" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="178.0" y="507.5" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Use native timestamps</text>
<text x="178.0" y="522.5" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">times = profile index</text>
<rect x="588" y="470" width="240" height="80" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="708.0" y="494.5" text-anchor="middle" class="node-title" font-size="11" fill="#FFFFFF">Reconstruct timestamps</text>
<text x="708.0" y="509.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">start = 2016-01-01</text>
<text x="708.0" y="522.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">periods = len(times), freq = 15 min</text>
<text x="708.0" y="535.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">tz = Europe/Berlin</text>
<circle cx="440" cy="590" r="12" fill="#5F5E5A"/>
<rect x="215.0" y="628" width="450" height="92" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="440.0" y="658.5" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Build load + sgen frames</text>
<text x="440.0" y="673.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">load_df = profiles[(load,p_mw)] -&gt; index=times -&gt; clip &gt;=0</text>
<text x="440.0" y="686.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">sgen_prof = profiles[(sgen,p_mw)] -&gt; shared source frame</text>
<text x="440.0" y="699.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">select only columns that exist in returned profile tables</text>
<rect x="215.0" y="754" width="450" height="92" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="440.0" y="784.5" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Classify DER columns</text>
<text x="440.0" y="799.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">PV mask: type contains pv | solar | lv_res</text>
<text x="440.0" y="812.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">wind mask: type contains wind | wp</text>
<text x="440.0" y="825.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">pv_idx/wind_idx from net.sgen then intersect with sgen_prof</text>
<rect x="215.0" y="880" width="450" height="92" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="440.0" y="910.5" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Physical cleanup</text>
<text x="440.0" y="925.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">PV night-zero for hour &gt;=22 or &lt;=4</text>
<text x="440.0" y="938.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">PV and wind clip &gt;=0 to remove scaling artefacts</text>
<text x="440.0" y="951.5" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">empty selections remain empty DataFrames</text>
<rect x="215.0" y="1008" width="450" height="78" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="440.0" y="1038.0" text-anchor="middle" class="node-title" font-size="12.8" fill="#FFFFFF">Assemble profile result</text>
<text x="440.0" y="1053.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">result = {load, pv, wind, times, net_type}</text>
<text x="440.0" y="1066.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">PV/wind contain only classified SimBench sgen columns</text>
<rect x="215.0" y="1120" width="450" height="74" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="440.0" y="1148.0" text-anchor="middle" class="node-title" font-size="12.3" fill="#FFFFFF">find_extreme_days(result)</text>
<text x="440.0" y="1163.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">safe_sum handles empty frames</text>
<text x="440.0" y="1176.0" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">daily means -&gt; max/min DER day and max/min load day</text>
<rect x="215.0" y="1230" width="450" height="52" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="440.0" y="1261.0" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">return profiles dict</text>
<path d="M440 136 L440 157" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M315 190 L194 190" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="307.0" y="182" text-anchor="end" fill="#7A5C12" font-size="10" font-weight="700">no</text>
<path d="M440 221 L440 253" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="450" y="237.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<path d="M565 286 L686 286" class="edge-red" marker-end="url(#arrowRed)"/>
<text x="573.0" y="278" text-anchor="start" fill="#993C1D" font-size="10" font-weight="700">no</text>
<path d="M440 317 L440 352" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="450" y="333.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<path d="M440 442 L440 476" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M300 510 L280 510" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="292.0" y="502" text-anchor="end" fill="#7A5C12" font-size="10" font-weight="700">yes</text>
<path d="M580 510 L586 510" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="588.0" y="502" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">no</text>
<path d="M178 540 L178 590 L426 590" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M708 550 L708 590 L454 590" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M440 602 L440 626" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M440 720 L440 752" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M440 846 L440 878" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M440 972 L440 1006" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M440 1086 L440 1118" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M440 1194 L440 1228" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>