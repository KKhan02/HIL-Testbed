<text x="805.0" y="568.57" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.92">hardware requested but this run is dry</text>
<text x="805.0" y="584.57" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.92">or no serial port was supplied</text>
