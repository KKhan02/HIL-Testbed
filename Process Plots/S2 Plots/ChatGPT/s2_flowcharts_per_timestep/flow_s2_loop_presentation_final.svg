<text x="805.0" y="682" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.90">restore prev_tap; blocked_reason set</text>
<text x="805.0" y="695" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.90">runpp() again at previous tap</text>
