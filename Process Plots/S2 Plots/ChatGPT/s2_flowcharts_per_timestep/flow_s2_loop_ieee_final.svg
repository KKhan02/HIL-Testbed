<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1900" viewBox="0 0 980 1900"><title>Scenario 2 per-timestep OLTC flow - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs><style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil{fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="952" height="1872" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="490.0" y="36" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Scenario 2 - Per-Timestep OLTC Execution</text>
<polygon points="500,55.0 580.0,80 500,105.0 420.0,80" fill="#5F5E5A"/>
<text x="500" y="76" text-anchor="middle" class="node-title" font-size="14" fill="#FFFFFF">for each t</text>
<text x="500" y="90" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">in time_steps</text>
<rect x="280" y="120" width="440" height="62" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="140" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">[1] write timestep profiles</text>
<text x="500.0" y="155" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">load P/Q; DER P=profile; DER Q=0</text>
<path d="M500 105 L500 118" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="280" y="210" width="440" height="54" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="230" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">[2] pre-action PF at current tap</text>
<text x="500.0" y="245" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">pp.runpp(voltage_depend_loads=False)</text>
<path d="M500 182 L500 208" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="500,290.0 610.0,322 500,354.0 390.0,322" fill="#854F0B"/>
<text x="500" y="326" text-anchor="middle" class="node-title" font-size="13" fill="#FFFFFF">pre-PF converged?</text>
<path d="M500 264 L500 288" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="90" y="284" width="190" height="76" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="185.0" y="304" text-anchor="middle" class="node-title" font-size="11" fill="#FFFFFF">Pre-PF failure</text>
<text x="185.0" y="319" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">append failed record</text>
<text x="185.0" y="332" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">hold tap; no publish; continue</text>
<path d="M390 322 L282 322" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="382.0" y="313" text-anchor="end" fill="#D85A30" font-size="10" font-weight="700">no</text>
<rect x="280" y="398" width="440" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="418" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">[3] read controlled-bus voltage</text>
<text x="500.0" y="433" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">vm_ctrl = mean(vm_pu); min/max are diagnostics</text>
<path d="M500 354 L500 396" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510" y="372.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<polygon points="500,481.0 635.0,520 500,559.0 365.0,520" fill="#854F0B"/>
<text x="500" y="524" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">vm_ctrl vs [0.98, 1.02]?</text>
<path d="M500 456 L500 479" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="92" y="484" width="245" height="72" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="214.5" y="504" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">Overvoltage candidate</text>
<text x="214.5" y="519" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">current_tap + sign*1</text>
<text x="214.5" y="532" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">clip to ganged min/max</text>
<rect x="662" y="484" width="245" height="72" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="784.5" y="504" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">Undervoltage candidate</text>
<text x="784.5" y="519" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">current_tap - sign*1</text>
<text x="784.5" y="532" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">clip to ganged min/max</text>
<path d="M365 520 L339 520" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="369.0" y="508" text-anchor="end" fill="#7A5C12" font-size="10" font-weight="700">&gt; 1.02</text>
<path d="M635 520 L660 520" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="631.0" y="508" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">&lt; 0.98</text>
<rect x="350" y="590" width="300" height="58" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="500.0" y="610" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">In deadband: hold tap</text>
<text x="500.0" y="625" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">tap_attempted=False; reuse pre-PF</text>
<path d="M500 559 L500 588" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="512" y="577.0" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">0.98-1.02</text>
<path d="M214.5 556 L214.5 686 L486 686" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M784.5 556 L784.5 686 L514 686" class="edge-gate" marker-end="url(#arrowGate)"/>
<circle cx="500" cy="686" r="12" fill="#5F5E5A"/>
<polygon points="500,721.0 620.0,752 500,783.0 380.0,752" fill="#854F0B"/>
<text x="500" y="756" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">candidate != current_tap?</text>
<path d="M500 698 L500 719" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="722" y="718" width="220" height="68" rx="10" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="832.0" y="738" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">Tap limit reached</text>
<text x="832.0" y="753" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">blocked_reason=tap_limit_reached</text>
<text x="832.0" y="766" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">reuse pre-PF; converged_post=True</text>
<path d="M620 752 L720 752" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="628.0" y="744" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">no</text>
<rect x="300" y="824" width="400" height="62" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="844" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">[5] apply candidate tap to ganged trafos</text>
<text x="500.0" y="859" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">save prev_tap; set tap_pos=candidate</text>
<path d="M500 783 L500 822" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510" y="801.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<rect x="300" y="916" width="400" height="56" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="936" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">[5a] post-tap PF</text>
<text x="500.0" y="951" text-anchor="middle" class="node-sub" font-size="9" fill="#FFFFFF" opacity="0.90">try pp.runpp() at candidate tap</text>
<path d="M500 886 L500 914" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="500,1007.0 610.0,1038 500,1069.0 390.0,1038" fill="#854F0B"/>
<text x="500" y="1042" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">post-tap PF converged?</text>
<path d="M500 972 L500 1005" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="120" y="1082" width="255" height="68" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="247.5" y="1102" text-anchor="middle" class="node-title" font-size="11" fill="#FFFFFF">Accept tap move</text>
<text x="247.5" y="1117" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">current_tap=candidate</text>
<text x="247.5" y="1130" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">tap_changed=True</text>
<rect x="625" y="1072" width="290" height="88" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="770.0" y="1092" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">Rollback candidate tap</text>
<text x="770.0" y="1107" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">restore prev_tap; blocked=post_pf_non_convergence</text>
<text x="770.0" y="1120" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">runpp() again at previous tap</text>
<path d="M390 1038 L247.5 1038 L247.5 1080" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="382.0" y="1030" text-anchor="end" fill="#7A5C12" font-size="10" font-weight="700">yes</text>
<path d="M610 1038 L770 1038 L770 1070" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="618.0" y="1030" text-anchor="start" fill="#D85A30" font-size="10" font-weight="700">no</text>
<path d="M247.5 1150 L247.5 1206 L486 1206" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M770 1160 L770 1206 L514 1206" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="500" cy="1206" r="12" fill="#5F5E5A"/>
<path d="M350 619 L100 619 L100 1244 L486 1244" class="edge-gate"/>
<path d="M942 752 L955 752 L955 1244 L514 1244" class="edge-gate"/>
<path d="M500 1218 L500 1230" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M100 1244 L486 1244" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M955 1244 L514 1244" class="edge-gate" marker-end="url(#arrowGate)"/>
<circle cx="500" cy="1244" r="12" fill="#5F5E5A"/>
<polygon points="500,1282.0 610.0,1312 500,1342.0 390.0,1312" fill="#854F0B"/>
<text x="500" y="1316" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">settled PF converged?</text>
<path d="M500 1256 L500 1280" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="105" y="1356" width="245" height="72" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="227.5" y="1376" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">Non-converged settled state</text>
<text x="227.5" y="1391" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">empty V/loading; losses/import=None</text>
<text x="227.5" y="1404" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">possible only if rollback PF also fails</text>
<rect x="610" y="1352" width="315" height="80" rx="10" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="767.5" y="1372" text-anchor="middle" class="node-title" font-size="11" fill="#FFFFFF">Extract settled network state</text>
<text x="767.5" y="1387" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">V / line / trafo results; violations</text>
<text x="767.5" y="1400" text-anchor="middle" class="node-sub" font-size="8.5" fill="#FFFFFF" opacity="0.90">losses + grid import + DER/load totals</text>
<path d="M390 1312 L227.5 1312 L227.5 1354" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="382.0" y="1304" text-anchor="end" fill="#D85A30" font-size="10" font-weight="700">no</text>
<path d="M610 1312 L767.5 1312 L767.5 1350" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="618.0" y="1304" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<path d="M227.5 1428 L227.5 1470 L486 1470" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M767.5 1432 L767.5 1470 L514 1470" class="edge-dark" marker-end="url(#arrowDark)"/>
<circle cx="500" cy="1470" r="12" fill="#5F5E5A"/>
<rect x="260" y="1504" width="480" height="76" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="1524" text-anchor="middle" class="node-title" font-size="11.5" fill="#FFFFFF">[6] build settled TimestepRecord</text>
<text x="500.0" y="1539" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">tap flags / blocked_reason; final network state</text>
<text x="500.0" y="1552" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.90">publish_fn.on_timestep(rec) -&gt; records.append(rec)</text>
<path d="M500 1482 L500 1502" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="500,1607.0 600.0,1634 500,1661.0 400.0,1634" fill="#854F0B"/>
<text x="500" y="1638" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">t % 96 == 0?</text>
<path d="M500 1580 L500 1605" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="720" y="1603" width="240" height="62" rx="10" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="840.0" y="1623" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">Periodic progress</text>
<text x="840.0" y="1638" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">optional partial result -&gt; live CSV</text>
<text x="840.0" y="1651" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">log tap / vm_ctrl / violation counts</text>
<path d="M600 1634 L718 1634" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="608.0" y="1626" text-anchor="start" fill="#7A5C12" font-size="10" font-weight="700">yes</text>
<path d="M500 1661 L500 1694" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510" y="1677.0" text-anchor="start" fill="#111111" font-size="10" font-weight="700">no</text>
<path d="M840 1665 L840 1708 L514 1708" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M90 322 L58 322" class="edge-hil"/>
<path d="M58 322 L58 1708" class="edge-hil"/>
<path d="M58 1708 L486 1708" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="500" cy="1708" r="12" fill="#5F5E5A"/>
<polygon points="500,1758.0 590.0,1782 500,1806.0 410.0,1782" fill="#854F0B"/>
<text x="500" y="1786" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">more timesteps?</text>
<path d="M500 1720 L500 1756" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="650" y="1760" width="230" height="44" rx="9" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="765.0" y="1780" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">loop complete</text>
<text x="765.0" y="1795" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">return to top-level finalization</text>
<path d="M590 1782 L648 1782" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="598.0" y="1775" text-anchor="start" fill="#111111" font-size="10" font-weight="700">no</text>
<path d="M500 1806 L500 1840 L42 1840 L42 80 L418 80" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="512" y="1822.0" text-anchor="start" fill="#3D8FD9" font-size="10" font-weight="700">yes - next t</text>
</svg>