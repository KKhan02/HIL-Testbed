<rect x="1040" y="26" width="840" height="292" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1062" y="56" text-anchor="start" fill="#111111" font-size="16" font-weight="700">Weather ingestion + cleanup</text>
<text x="1062" y="92" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">find_dwd_file(): explicit file_map first; otherwise DWD CDC glob naming.</text>
<text x="1062" y="125" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">read_weather_csv(): parse timestamps, sort, UTC-localize, convert to Europe/Berlin.</text>
<text x="1062" y="158" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Values are numeric-coerced; non-numeric source entries become NaN.</text>
<text x="1062" y="191" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Solar: explicit RAD-G mapping is assumed W/m2; otherwise DWD J/cm2 is converted.</text>
<text x="1062" y="224" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">DWD solar interval is median timestamp spacing, with 600 s only as short-file fallback.</text>
<text x="1062" y="257" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Solar GHI and wind speed are clipped &gt;=0 and NaNs are dropped by their loaders.</text>
<text x="1062" y="290" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Temperature is assumed degC and NaNs are dropped; then all timestamps are intersected.</text>
<rect x="1040" y="338" width="840" height="330" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1062" y="368" text-anchor="start" fill="#111111" font-size="16" font-weight="700">Per-element conversion models</text>
<text x="1062" y="404" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Loads: H25/G25/L25 from oemof.demand; semantic metadata is used first.</text>
<text x="1062" y="437" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Unclassified loads receive seeded 82% H25 / 15% G25 / 3% L25 assignment.</text>
<text x="1062" y="470" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">BDEW time variation is preserved: raw shape / raw peak, then multiply by load p_mw.</text>
<text x="1062" y="503" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Thus net.load.p_mw anchors the profile maximum, not a constant demand value.</text>
<text x="1062" y="536" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">PV: Erbs -&gt; POA -&gt; NOCT temperature -&gt; efficiency correction -&gt; DC -&gt; inverter AC.</text>
<text x="1062" y="569" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">PV cleanup: POA NaN/negative cleanup, 10 W/m2 cutoff, rated clipping, night-zero.</text>
<text x="1062" y="602" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Wind: 0 below 3 m/s, cubic to 12 m/s, rated to 25 m/s, then 0 at cut-out.</text>
<text x="1062" y="635" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Wind output is clipped 0..rated; absent PV/wind types leave an empty DataFrame.</text>
<rect x="1040" y="688" width="840" height="336" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1062" y="718" text-anchor="start" fill="#111111" font-size="16" font-weight="700">Year selection, result schema, and edge cases</text>
<text x="1062" y="754" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Implementation note: the code scans candidate years in ascending order and breaks on the first complete year.</text>
<text x="1062" y="787" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Therefore the current implementation selects the earliest complete year, despite nearby wording that suggests &#x27;most recent&#x27;.</text>
<text x="1062" y="820" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">If no complete year exists, the code chooses the year with the most aligned timesteps and emits a warning.</text>
<text x="1062" y="853" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">All three profile families are returned with the common schema load, pv, wind, times, and net_type.</text>
<text x="1062" y="886" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">If no matching PV or wind sgen types are found, the corresponding DataFrame remains empty.</text>
<text x="1062" y="919" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">safe_sum in find_extreme_days keeps daily aggregation valid even when PV or wind frames are empty.</text>
<text x="1062" y="952" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">The fallback path computes extreme days after assembling the common schema.</text>
</svg>