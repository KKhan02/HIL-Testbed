<text x="465.0" y="506.5" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">all three tables use identical times after .loc[times]</text>
<rect x="140.0" y="544" width="650" height="46" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="465.0" y="564.5" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">Build per-element profiles</text>
<text x="465.0" y="579.5" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">BDEW loads | PV sgens | wind sgens</text>
<rect x="40" y="618" width="270" height="112" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="175.0" y="645.5" text-anchor="middle" class="node-title" font-size="9.8" fill="#FFFFFF">Loads: BDEW 2025</text>
<text x="175.0" y="660.5" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.90">metadata -&gt; H25/G25/L25</text>
<text x="175.0" y="673.5" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.90">missing metadata -&gt; deterministic 82/15/3 mix</text>
<text x="175.0" y="686.5" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.90">normalize raw BDEW shape by peak</text>
<text x="175.0" y="699.5" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.90">scale maximum to each net.load.p_mw</text>
<text x="175.0" y="712.5" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.90">clip &gt;=0; fill NaN=0</text>
<rect x="330" y="618" width="270" height="112" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="465.0" y="645.5" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">PV per sgen</text>
<text x="465.0" y="660.5" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.90">Erbs GHI -&gt; DNI/DHI -&gt; POA</text>
<text x="465.0" y="673.5" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.90">POA NaN/negative cleanup + 10 W/m2 threshold</text>
<text x="465.0" y="686.5" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.90">NOCT cell temperature -&gt; corrected DC -&gt; inverter AC</text>
<text x="465.0" y="699.5" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.90">reindex/fill 0; clip 0..rated</text>
<text x="465.0" y="712.5" text-anchor="middle" class="node-sub" font-size="7.1" fill="#FFFFFF" opacity="0.90">night-zero &gt;=22 or &lt;=4; empty if no PV</text>
<rect x="620" y="618" width="270" height="112" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="755.0" y="652.0" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">Wind per sgen</text>
<text x="755.0" y="667.0" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.90">wind speed clipped &gt;=0 / NaN dropped by loader</text>
<text x="755.0" y="680.0" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.90">piecewise cubic: 3 m/s -&gt; 12 m/s -&gt; 25 m/s</text>
<text x="755.0" y="693.0" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.90">0 below cut-in and at/above cut-out</text>
<text x="755.0" y="706.0" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.90">clip output 0..rated; empty if no wind</text>
<circle cx="465" cy="770" r="11" fill="#5F5E5A"/>
<rect x="140.0" y="798" width="650" height="52" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="465.0" y="821.5" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Assemble common output schema</text>
<text x="465.0" y="836.5" text-anchor="middle" class="node-sub" font-size="8.3" fill="#FFFFFF" opacity="0.90">load | pv | wind | times | net_type</text>
<rect x="140.0" y="876" width="650" height="56" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="465.0" y="901.5" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">find_extreme_days()</text>
<text x="465.0" y="916.5" text-anchor="middle" class="node-sub" font-size="8.2" fill="#FFFFFF" opacity="0.90">safe_sum handles empty PV/wind; daily means -&gt; max/min DER and load</text>
<rect x="140.0" y="958" width="650" height="40" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="465.0" y="983.0" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">return profiles dict</text>
