<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Scenario 5 top-level AC OPF flow - presentation scaled</title>
<defs>
  <marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
  <marker id="arrowWhite" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#FFFFFF"/></marker>
  <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
  <marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
  <marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
</defs>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
.node-title { font-weight:700; } .node-sub { font-weight:400; }
.edge-dark { fill:none; stroke:#263238; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-white { fill:none; stroke:#FFFFFF; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-red { fill:none; stroke:#D85A30; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-gate { fill:none; stroke:#7A5C12; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-loop { fill:none; stroke:#3D8FD9; stroke-width:2.8; stroke-dasharray:7 5; stroke-linejoin:round; stroke-linecap:round; }
</style>
<rect x="24" y="18" width="1872" height="1044" rx="24" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.6"/>
<rect x="530.0" y="42" width="860" height="72" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="960.0" y="70" text-anchor="middle" class="node-title" font-size="29" fill="#FFFFFF">run_scenario_5()</text>
<text x="960.0" y="89" text-anchor="middle" class="node-sub" font-size="20" fill="#FFFFFF" opacity="0.90">network, profiles, OPF limits / options</text>
<rect x="530.0" y="154" width="860" height="92" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="960.0" y="182" text-anchor="middle" class="node-title" font-size="27" fill="#FFFFFF">Prepare simulation</text>
<text x="960.0" y="201" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">continuous bus index + adapt profiles</text>
<text x="960.0" y="218" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">publisher start + checkpoint resume</text>
<rect x="530.0" y="286" width="860" height="100" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="960.0" y="314" text-anchor="middle" class="node-title" font-size="27" fill="#FFFFFF">Prepare OPF model</text>
<text x="960.0" y="333" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">clear controllers / results; static OPF bounds</text>
<text x="960.0" y="350" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">PF options; diagnostic; derive sn_rated</text>
<polygon points="960.0,420.0 1115.0,466 960.0,512.0 805.0,466" fill="#854F0B"/>
<text x="960.0" y="471" text-anchor="middle" class="node-title" font-size="24" fill="#FFFFFF">checkpoint complete?</text>
<rect x="530.0" y="552" width="860" height="88" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="960.0" y="580" text-anchor="middle" class="node-title" font-size="27" fill="#FFFFFF">Per-timestep OPF loop</text>
<text x="960.0" y="599" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">state build + runopp + record / publish</text>
<text x="960.0" y="616" text-anchor="middle" class="node-sub" font-size="19" fill="#FFFFFF" opacity="0.90">see detailed execution figure</text>
<circle cx="960.0" cy="708" r="16" fill="#5F5E5A"/>
<rect x="530.0" y="760" width="860" height="80" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="960.0" y="788" text-anchor="middle" class="node-title" font-size="25" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="960.0" y="807" text-anchor="middle" class="node-sub" font-size="18" fill="#FFFFFF" opacity="0.90">aggregate resumed + newly simulated records</text>
<rect x="530.0" y="884" width="860" height="68" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="960.0" y="912" text-anchor="middle" class="node-title" font-size="25" fill="#FFFFFF">on_scenario_end()</text>
<text x="960.0" y="931" text-anchor="middle" class="node-sub" font-size="18" fill="#FFFFFF" opacity="0.90">final live event / elapsed persistence</text>
<rect x="530.0" y="998" width="860" height="50" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="960.0" y="1029.0" text-anchor="middle" class="node-title" font-size="25" fill="#FFFFFF">return ScenarioResult</text>
<path d="M960 114 L960 152" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M960 246 L960 284" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M960 386 L960 418" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M960 512 L960 550" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="978.0" y="536.0" text-anchor="start" fill="#111111" font-size="17" font-weight="700">no</text>
<path d="M960 640 L960 690" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M805 466 L380 466 L380 708 L942 708" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="787.0" y="452" text-anchor="end" fill="#7A5C12" font-size="17" font-weight="700">yes - skip loop</text>
<path d="M960 724 L960 758" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M960 840 L960 882" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M960 952 L960 996" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>