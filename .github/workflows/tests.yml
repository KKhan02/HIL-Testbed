name: Run Test Suite

on:
  push:
  pull_request:

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simbench_mvlv_rural:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pandapower simbench pvlib "oemof-demand>=0.2.2" workalendar
      - name: Run SimBench MVLV rural
        run: python test_suite.py --only "MVLV-rural"

  simbench_mvlv_semiurb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
