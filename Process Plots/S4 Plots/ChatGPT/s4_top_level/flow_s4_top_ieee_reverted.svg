<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1040" viewBox="0 0 780 1040">
<title>Scenario 4 top-level flow - IEEE</title>
<defs>
  <marker id="arrowWhite" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#FFFFFF"/></marker>
  <marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
  <marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
  <marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
.node-title { font-weight:700; } .node-sub { font-weight:400; }
.edge { fill:none; stroke:#FFFFFF; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
.edge-dark { fill:none; stroke:#263238; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
.edge-hil { fill:none; stroke:#D85A30; stroke-width:3.2; stroke-linejoin:round; stroke-linecap:round; }
.edge-dry { fill:none; stroke:#6B9E26; stroke-width:3.2; stroke-linejoin:round; stroke-linecap:round; }
</style>
<rect x="42" y="32" width="696" height="974" rx="20" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="2"/>
<text x="390" y="70" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">Scenario 4 - Top-Level Volt-Var HIL Flow</text>
<g transform="translate(0,-20)">
<rect x="180" y="124" width="420" height="74" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390" y="154" text-anchor="middle" class="node-title" font-size="18" fill="white">run_scenario_4()</text>
<text x="390" y="175" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">network, profiles, mode</text>
<path d="M390 198 L390 224" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="180" y="226" width="420" height="88" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390" y="258" text-anchor="middle" class="node-title" font-size="18" fill="white">Prepare simulation</text>
<text x="390" y="279" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">adapt profiles  |  publisher start</text>
<text x="390" y="298" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">reset stale controllers / results</text>
<path d="M390 314 L390 338" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="180" y="340" width="420" height="88" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="390" y="372" text-anchor="middle" class="node-title" font-size="18" fill="white">Build control stack</text>
<text x="390" y="393" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">Volt-Var controller  |  coordinator</text>
<text x="390" y="412" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">DER dynamics</text>
<path d="M390 428 L390 450" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="390,450.0 465.0,494 390,538.0 315.0,494" fill="#854F0B"/>
<text x="390" y="494" text-anchor="middle" class="node-title" font-size="17" fill="white">dry_run?</text>
<path d="M315 494 L225 494 L225 565" class="edge-dry" marker-end="url(#arrowDry)"/>
<text x="255" y="482" text-anchor="middle" fill="#6B9E26" font-size="13" font-weight="700">yes</text>
<rect x="110" y="567" width="230" height="80" rx="14" fill="#3B6D11" stroke="none" stroke-width="0"/>
<text x="225" y="598" text-anchor="middle" class="node-title" font-size="16" fill="white">Dry-run path</text>
<text x="225" y="619" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">configure() no-op</text>
<text x="225" y="638" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">local Q(V)</text>
<path d="M465 494 L555 494 L555 545" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="525" y="482" text-anchor="middle" fill="#D85A30" font-size="13" font-weight="700">no - HIL</text>
<rect x="440" y="547" width="230" height="80" rx="14" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="555" y="578" text-anchor="middle" class="node-title" font-size="16" fill="white">HIL path</text>
<text x="555" y="599" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">open serial link</text>
<text x="555" y="618" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">configure handshake</text>
<polygon points="390,649.0 411.0,665 390,681.0 369.0,665" fill="#5F5E5A"/>
<path d="M225 647 L225 665 L369 665" class="edge-dry" marker-end="url(#arrowDry)"/>
<path d="M555 627 L555 665 L411 665" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M390 681 L390 703" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="180" y="705" width="420" height="72" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390" y="735" text-anchor="middle" class="node-title" font-size="18" fill="white">Initialize state</text>
<text x="390" y="756" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">DERDynamics.reset()</text>
<path d="M390 777 L390 801" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="180" y="803" width="420" height="88" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="390" y="835" text-anchor="middle" class="node-title" font-size="18" fill="white">Per-timestep loop</text>
<text x="390" y="856" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">control + power flow + curtailment</text>
<text x="390" y="875" text-anchor="middle" class="node-sub" font-size="14" fill="white" opacity="0.86">record / publish   |   see Diagram 2</text>
<path d="M390 891 L390 915" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="180" y="917" width="420" height="76" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="390" y="947" text-anchor="middle" class="node-title" font-size="17" fill="white">Finalize and return</text>
<text x="390" y="968" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">HIL: close() -&gt; TX END   |   dry-run: no close</text>
<text x="390" y="987" text-anchor="middle" class="node-sub" font-size="13" fill="white" opacity="0.86">from_records() -&gt; on_scenario_end -&gt; ScenarioResult</text>
</g>
</svg>