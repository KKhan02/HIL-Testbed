<text x="465" y="202" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">custom RAD-G file mapped?</text>
<rect x="60" y="177" width="225" height="42" rx="12" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="172.5" y="203.0" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Use solar as W/m2</text>
<rect x="655" y="170" width="250" height="56" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="780.0" y="195.5" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">DWD J/cm2 -&gt; W/m2</text>
<text x="780.0" y="210.5" text-anchor="middle" class="node-sub" font-size="8.1" fill="#FFFFFF" opacity="0.90">infer median sample interval; clip GHI &gt;=0</text>
<circle cx="465" cy="252" r="11" fill="#5F5E5A"/>
<rect x="140.0" y="278" width="650" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="465.0" y="298.0" text-anchor="middle" class="node-title" font-size="12.1" fill="#FFFFFF">Weather cleanup + common time index</text>
<text x="465.0" y="313.0" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">deduplicate each table; intersect solar, wind and temperature timestamps</text>
<text x="465.0" y="326.0" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.90">solar/wind loaders drop NaN after physical clipping</text>
