.edge-hil{fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="76" y="36" width="900" height="390" rx="18" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="94" y="60" text-anchor="start" fill="#111111" font-size="14" font-weight="700">Phase A - run_timeseries owns the power-flow sweep</text>
<rect x="210" y="72" width="540" height="42" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="480.0" y="98.0" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">ts.run_timeseries(... continue_on_divergence=True, run=_timed_runpp)</text>
<polygon points="480,133.0 570.0,150 480,167.0 390.0,150" fill="#5F5E5A"/>
<text x="480" y="147" text-anchor="middle" class="node-title" font-size="12" fill="#FFFFFF">for each engine t</text>
