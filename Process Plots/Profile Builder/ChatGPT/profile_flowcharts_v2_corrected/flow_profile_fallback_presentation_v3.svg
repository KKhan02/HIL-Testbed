<text x="465.0" y="123.0" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">file_map/col_map optional; DWD defaults otherwise</text>
<text x="465.0" y="136.0" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.90">read_weather_csv localizes UTC -&gt; Europe/Berlin and numeric-coerces values</text>
