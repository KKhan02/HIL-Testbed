<text x="147.5" y="712.5" text-anchor="middle" class="node-title" font-size="14.5" fill="#FFFFFF">hc.json</text>
<text x="147.5" y="731.5" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">build_hc_payload</text>
<polygon points="465,771.0 587.5,798 465,825.0 342.5,798" fill="#854F0B"/>
<text x="465" y="803.0" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">comparison available?</text>
<rect x="850" y="769" width="215" height="58" rx="10" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="957.5" y="794.5" text-anchor="middle" class="node-title" font-size="14.5" fill="#FFFFFF">comparison.json</text>
<text x="957.5" y="813.5" text-anchor="middle" class="node-sub" font-size="10" fill="#FFFFFF" opacity="0.90">comparison_df -&gt; records</text>
<rect x="115.0" y="866" width="700" height="60" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="465.0" y="892.5" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">Return written paths</text>
<text x="465.0" y="911.5" text-anchor="middle" class="node-sub" font-size="12.5" fill="#FFFFFF" opacity="0.90">independent writes; no monolithic publish_result()</text>
<rect x="115.0" y="958" width="700" height="72" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="465.0" y="990.5" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Static publisher output</text>
<text x="465.0" y="1009.5" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">system files + one JSON per completed scenario + final summaries</text>
