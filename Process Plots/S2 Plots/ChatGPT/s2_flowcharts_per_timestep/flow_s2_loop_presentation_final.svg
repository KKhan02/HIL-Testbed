<circle cx="480" cy="772" r="12" fill="#5F5E5A"/>
<polygon points="480,802.0 595.0,822 480,842.0 365.0,822" fill="#854F0B"/>
<text x="480" y="826" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">settled PF converged?</text>
<path d="M480 784 L480 800" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="70" y="800" width="250" height="44" rx="10" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="195.0" y="820" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">Non-converged settled state</text>
<text x="195.0" y="835" text-anchor="middle" class="node-sub" font-size="7.9" fill="#FFFFFF" opacity="0.90">rollback PF also failed</text>
<rect x="660" y="796" width="330" height="52" rx="10" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="825.0" y="816" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">Extract final state</text>
<text x="825.0" y="831" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">V/loading + violations + losses/import</text>
<path d="M365 822 L322 822" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="355.0" y="815" text-anchor="end" fill="#D85A30" font-size="10" font-weight="700">no</text>
<path d="M595 822 L658 822" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="605.0" y="815" text-anchor="start" fill="#111111" font-size="10" font-weight="700">yes</text>
<path d="M195 844 L195 872 L466 872" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M825 848 L825 872 L494 872" class="edge-dark" marker-end="url(#arrowDark)"/>
<circle cx="480" cy="872" r="12" fill="#5F5E5A"/>
<rect x="225" y="892" width="510" height="38" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="480.0" y="916.0" text-anchor="middle" class="node-title" font-size="11.8" fill="#FFFFFF">[6] build record -&gt; publish -&gt; append</text>
<path d="M480 884 L480 890" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="480,946.0 575.0,966 480,986.0 385.0,966" fill="#854F0B"/>
<text x="480" y="970" text-anchor="middle" class="node-title" font-size="11.3" fill="#FFFFFF">t % 96 == 0?</text>
<path d="M480 930 L480 944" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="730" y="936" width="300" height="44" rx="10" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="880.0" y="956" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">Periodic progress</text>
<text x="880.0" y="971" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.90">optional partial CSV + logger.info</text>
