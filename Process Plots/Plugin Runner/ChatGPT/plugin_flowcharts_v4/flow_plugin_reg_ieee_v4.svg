<text x="490.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Custom Controller Plugin - Registration and Execution Routing</text>
<rect x="225" y="62" width="550" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="87.59" text-anchor="middle" class="node-title" font-size="13.5" fill="#FFFFFF">register_and_run(...)</text>
<text x="500.0" y="103.59" text-anchor="middle" class="node-sub" font-size="9.3" fill="#FFFFFF" opacity="0.92">YAML, net, profiles, network_id, config, port</text>
<rect x="210" y="145" width="580" height="78" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="172.148" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">load_plugin(yaml) -&gt; cfg</text>
<text x="500.0" y="188.148" text-anchor="middle" class="node-sub" font-size="8.7" fill="#FFFFFF" opacity="0.92">validate required fields, plugin name, paths, kwargs, gate/clamp flags</text>
<text x="500.0" y="204.148" text-anchor="middle" class="node-sub" font-size="8.7" fill="#FFFFFF" opacity="0.92">hardware:true additionally validates an existing .ino path</text>
<rect x="210" y="248" width="580" height="62" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="275.08" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">_import_controller_fn(module_path, function)</text>
<text x="500.0" y="291.08" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.92">unique sys.modules name; execute module; require named callable</text>
<rect x="210" y="335" width="580" height="58" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="360.148" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">Bind YAML kwargs</text>
<text x="500.0" y="376.148" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.92">controller_fn = partial(fn, **kwargs) or fn</text>
