<rect x="14" y="14" width="1152" height="1407" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="590.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Network Plugin - Profile Strategy Dispatch and HC Profile Factory</text>
<rect x="300" y="60" width="620" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="610.0" y="85.148" text-anchor="middle" class="node-title" font-size="12.2" fill="#FFFFFF">_build_profiles_for_strategy(net, cfg)</text>
<text x="610.0" y="101.148" text-anchor="middle" class="node-sub" font-size="8.6" fill="#FFFFFF" opacity="0.92">strategy = cfg[&#x27;strategy&#x27;]</text>
<polygon points="610,145.0 770.0,178 610,211.0 450.0,178" fill="#854F0B"/>
<text x="610" y="174.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">strategy == simbench_native AND</text>
<text x="610" y="188.638" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.92">no SimBench net.profiles metadata?</text>
<path d="M610 118 L610 143" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="795" y="145" width="320" height="66" rx="9" fill="#3B6D11" stroke="none" stroke-width="0"/>
<text x="955.0" y="173.264" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">Warn + set strategy = dwd_pvlib</text>
<text x="955.0" y="189.264" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">requested strategy remains separately recorded</text>
<path d="M770 178 L793 178" class="edge-dry" marker-end="url(#arrowDry)"/>
<text x="782.5" y="170" text-anchor="middle" fill="#3B6D11" font-size="8.3" font-weight="700">yes</text>
<circle cx="610" cy="270" r="11" fill="#5F5E5A"/>
<path d="M610 211 L610 257" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="624" y="225.0" text-anchor="start" fill="#111111" font-size="8.3" font-weight="700">no</text>
<path d="M955 211 L955 270 L623 270" class="edge-dry" marker-end="url(#arrowDry)"/>
<polygon points="610,321.0 740.0,350 610,379.0 480.0,350" fill="#854F0B"/>
<text x="610" y="353.604" text-anchor="middle" class="node-title" font-size="10.6" fill="#FFFFFF">strategy == simbench_native?</text>
<path d="M610 281 L610 319" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="55" y="321" width="320" height="58" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="215.0" y="345.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">sb.get_absolute_values(net)</text>
<text x="215.0" y="361.298" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">load and sgen absolute-value profiles</text>
<path d="M480 350 L377 350" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="427.5" y="342" text-anchor="middle" fill="#7A5C12" font-size="8.3" font-weight="700">yes</text>
<polygon points="215,427.0 340.0,455 215,483.0 90.0,455" fill="#854F0B"/>
<text x="215" y="458.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">times is DatetimeIndex?</text>
<path d="M215 379 L215 425" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="50" y="525" width="330" height="58" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="215.0" y="548.992" text-anchor="middle" class="node-title" font-size="8.8" fill="#FFFFFF">Rebuild configured-year 15-min DatetimeIndex</text>
<text x="215.0" y="564.992" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">only when SimBench returned integer step index</text>
<path d="M215 483 L215 523" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="227" y="495.0" text-anchor="start" fill="#7A5C12" font-size="7.8" font-weight="700">no</text>
<circle cx="215" cy="625" r="9" fill="#5F5E5A"/>
<path d="M90 455 L25 455 L25 625 L204 625" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="72.0" y="448" text-anchor="end" fill="#7A5C12" font-size="7.8" font-weight="700">yes</text>
<path d="M215 583 L215 614" class="edge-gate" marker-end="url(#arrowGate)"/>
<rect x="35" y="660" width="360" height="92" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="215.0" y="685.06" text-anchor="middle" class="node-title" font-size="9.0" fill="#FFFFFF">SimBench post-processing</text>
<text x="215.0" y="701.06" text-anchor="middle" class="node-sub" font-size="6.3" fill="#FFFFFF" opacity="0.92">clip load &gt;= 0; classify PV by pv|solar|lv_res and wind by wind|wp|wka</text>
<text x="215.0" y="717.06" text-anchor="middle" class="node-sub" font-size="6.3" fill="#FFFFFF" opacity="0.92">zero PV at hours &gt;=22 or &lt;=4; clip PV/wind &gt;=0; find_extreme_days</text>
<text x="215.0" y="733.06" text-anchor="middle" class="node-sub" font-size="6.3" fill="#FFFFFF" opacity="0.92">result net_type=&#x27;simbench&#x27;</text>
<path d="M215 634 L215 658" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="610,425.0 760.0,455 610,485.0 460.0,455" fill="#854F0B"/>
<text x="610" y="458.366" text-anchor="middle" class="node-title" font-size="9.9" fill="#FFFFFF">strategy in (&#x27;dwd_pvlib&#x27;, &#x27;custom&#x27;)?</text>
<path d="M610 379 L610 423" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="624" y="393.0" text-anchor="start" fill="#111111" font-size="8.3" font-weight="700">no</text>
<rect x="790" y="422" width="330" height="66" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="955.0" y="442.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">_build_profiles_dwd(net, cfg)</text>
<text x="955.0" y="458.23" text-anchor="middle" class="node-sub" font-size="6.8" fill="#FFFFFF" opacity="0.92">data_dir = cfg override or project DWD default; _dwd_safe_name(name)</text>
<text x="955.0" y="474.23" text-anchor="middle" class="node-sub" font-size="6.8" fill="#FFFFFF" opacity="0.92">build_annual_profiles(..., file_map, col_map); custom uses this same path</text>
<path d="M760 455 L788 455" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="775.0" y="447" text-anchor="middle" fill="#7A5C12" font-size="8.1" font-weight="700">yes</text>
<rect x="385" y="535" width="450" height="72" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="610.0" y="558.264" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">_build_profiles_flat(net, cfg)</text>
<text x="610.0" y="574.264" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">leap-aware full-year 15-min index; constant load.p_mw and sgen.p_mw frames</text>
<text x="610.0" y="590.264" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">PV/wind type masks; empty DER groups become empty frames; find_extreme_days</text>
<path d="M610 485 L610 533" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="624" y="499.0" text-anchor="start" fill="#111111" font-size="8.1" font-weight="700">no -&gt; flat</text>
<circle cx="610" cy="815" r="12" fill="#5F5E5A"/>
<path d="M215 752 L215 815 L596 815" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M955 488 L955 815 L624 815" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M610 607 L610 785 L610 801" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="330" y="855" width="560" height="62" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="610.0" y="881.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">return (profiles, strategy_used)</text>
<text x="610.0" y="897.638" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">actual strategy is available for plugin_meta</text>
<path d="M610 827 L610 853" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="275" y="975" width="670" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="610.0" y="999.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">make_profile_factory(yaml_path)</text>
<text x="610.0" y="1015.672" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.92">resolve path; _load_yaml_config once at factory creation</text>
<rect x="305" y="1057" width="610" height="58" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="610.0" y="1081.468" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">return closure _factory(net_hc)</text>
<text x="610.0" y="1097.468" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">BenchmarkConfig.profile_factory invokes it later on the stressed network</text>
<rect x="285" y="1139" width="650" height="66" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="610.0" y="1167.468" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">_factory: call _build_profiles_for_strategy(net_hc, cfg)</text>
<text x="610.0" y="1183.468" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">uses the configured strategy and the same simbench_native fallback behavior</text>
<rect x="265" y="1231" width="690" height="80" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="610.0" y="1258.332" text-anchor="middle" class="node-title" font-size="9.8" fill="#FFFFFF">Attach HC-stressed plugin_meta</text>
<text x="610.0" y="1274.332" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">name += &#x27;_hc_stressed&#x27;; preserve label/source/requested strategy/year/limits/notes</text>
<text x="610.0" y="1290.332" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">store strategy actually used for the stressed network</text>
<rect x="330" y="1337" width="560" height="58" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="610.0" y="1361.57" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">return rebuilt profiles</text>
<text x="610.0" y="1377.57" text-anchor="middle" class="node-sub" font-size="7.5" fill="#FFFFFF" opacity="0.92">fresh coverage for the HC-stressed network</text>
<path d="M610 1033 L610 1055" class="edge-dark" marker-end="url(#arrowDark)"/>
