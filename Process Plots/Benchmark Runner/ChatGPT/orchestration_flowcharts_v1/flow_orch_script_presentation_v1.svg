<rect x="1080" y="24" width="800" height="250" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="296" width="800" height="330" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="648" width="800" height="390" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Entry configuration</text>
<text x="1104" y="92" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">The direct script configures logging, parses optional network/controller YAML paths and accepts runtime Q(V) and planning-limit overrides.</text>
<text x="1104" y="126" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">Q(V) breakpoints and q-ratio are applied before any controller is constructed, so software and Arduino configuration use the same values.</text>
<text x="1104" y="160" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">Voltage and thermal limits are updated in violation_detector before benchmark dispatch.</text>
<text x="1104" y="194" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">The script creates separate publisher handles for the outer network and an optional HC-stressed network.</text>
<text x="1104" y="228" text-anchor="start" fill="#111111" font-size="11.2" font-weight="600">BenchmarkConfig carries scenario selection, dry-run/serial settings, HC controls, profile factory, checkpointing and publishing handles.</text>
<text x="1104" y="329" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Network and profile resolution</text>
<text x="1104" y="364" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">With --network, network_plugin loads both the network and profiles according to the YAML strategy, then validation warnings are reported.</text>
<text x="1104" y="406" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">If validation warnings require confirmation and -y is absent, the user can abort before any benchmark execution.</text>
<text x="1104" y="448" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">Without --network, the selected built-in network is loaded and build_annual_profiles creates the annual profile set.</text>
<text x="1104" y="490" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">Generation oversizing is conditional; sgen P/sn_mva and matching PV/wind profile columns use the same scale factor.</text>
<text x="1104" y="532" text-anchor="start" fill="#111111" font-size="11.1" font-weight="600">LOAD_SCALE is then applied consistently to network loads and the load profile before topology/profile publication.</text>
<text x="1104" y="681" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Benchmark dispatch and outputs</text>
<text x="1104" y="716" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">Topology and profiles are published once before the benchmark so the saved model corresponds to the network entering orchestration.</text>
<text x="1104" y="763" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">With --controller, plugin_runner temporarily registers the custom controller and runs it alongside BenchmarkConfig.scenarios.</text>
<text x="1104" y="810" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">Without --controller, the script calls benchmark_runner.run_benchmark directly.</text>
<text x="1104" y="857" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">After execution, publish_hc_and_comparison writes the outer comparison/HC artefacts.</text>
<text x="1104" y="904" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">If hc_benchmark and net_hc are available, the recursive benchmark artefacts are written to the separate HC-stressed output directory.</text>
<text x="1104" y="951" text-anchor="start" fill="#111111" font-size="11.0" font-weight="600">The script finally prints comparison, CSV, hosting-capacity, error and HC-stressed summaries when those result sections are available.</text>
</svg>