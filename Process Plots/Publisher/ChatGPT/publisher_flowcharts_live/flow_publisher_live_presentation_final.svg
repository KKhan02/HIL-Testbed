<text x="830.0" y="671.5" text-anchor="middle" class="node-title" font-size="10.2" fill="#FFFFFF">Dashboard sample</text>
<text x="830.0" y="686.5" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.90">persist elapsed; build frame; append JSONL</text>
