<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>CLI wizard RunPlan construction - presentation</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="155" y="24" width="690" height="48" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="43.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">run_wizard(): index-walked configuration loop</text>
<text x="500.0" y="59.672" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">one RunPlan is assembled from step results</text>
<rect x="145" y="112" width="710" height="84" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="149.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">Create state + ordered 9-step callback list</text>
<text x="500.0" y="165.23" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">Study | Network | Network mods | Dataset | Time | Parameters | Hardware | Streaming | Controller plugin</text>
<path d="M500 72 L500 110" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="500,279.0 615.0,300 500,321.0 385.0,300" fill="#854F0B"/>
<text x="500" y="303.332" text-anchor="middle" class="node-title" font-size="9.8" fill="#FFFFFF">another step?</text>
<path d="M500 196 L500 277" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="200" y="385" width="600" height="80" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="412.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">Run current step callback</text>
<text x="500.0" y="428.094" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">name, fn = steps[index]; print Step i/9; try: fn(state)</text>
<text x="500.0" y="444.094" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">prompts update state; plugin network skips standalone dataset prompting</text>
<path d="M500 321 L500 383" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="511" y="332.0" text-anchor="start" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<rect x="35" y="397" width="155" height="56" rx="8" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="112.5" y="411.38" text-anchor="middle" class="node-title" font-size="7.0" fill="#FFFFFF">BackRequested handler</text>
<text x="112.5" y="427.38" text-anchor="middle" class="node-sub" font-size="5.0" fill="#FFFFFF" opacity="0.92">if first step: print notice</text>
<text x="112.5" y="443.38" text-anchor="middle" class="node-sub" font-size="5.0" fill="#FFFFFF" opacity="0.92">index=max(index-1,0); continue</text>
<path d="M200 425 L192 425" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="195.0" y="419.0" text-anchor="middle" fill="#3D8FD9" font-size="6.4" font-weight="700">BackRequested</text>
<rect x="330" y="550" width="340" height="52" rx="8" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="500.0" y="570.958" text-anchor="middle" class="node-title" font-size="8.7" fill="#FFFFFF">index += 1</text>
<text x="500.0" y="586.958" text-anchor="middle" class="node-sub" font-size="6.2" fill="#FFFFFF" opacity="0.92">normal callback return</text>
<path d="M500 465 L500 548" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="510.0" y="476" text-anchor="start" fill="#111111" font-size="6.9" font-weight="700">normal return</text>
<circle cx="500" cy="700" r="8" fill="#5F5E5A"/>
<path d="M500 602 L500 690" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M112.5 453 L112.5 700 L490 700" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 708 L500 755 L10 755 L10 300 L383 300" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="20" y="745" text-anchor="start" fill="#3D8FD9" font-size="6.8" font-weight="700">next loop test</text>
<rect x="190" y="930" width="620" height="64" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="957.162" text-anchor="middle" class="node-title" font-size="9.3" fill="#FFFFFF">Assemble + return RunPlan</text>
<text x="500.0" y="973.162" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">typed nested configs + run-control fields; dataclass defaults supply run_id/output_dir</text>
<path d="M615 300 L1000 300 L1000 962 L812 962" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="639.0" y="294" text-anchor="start" fill="#7A5C12" font-size="7.2" font-weight="700">no - all 9 complete</text>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="320" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="668" width="800" height="370" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Nine configuration steps</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">Study chooses scenario comparison, voltage variation, hosting capacity or OPF; hosting capacity may additionally request the stressed re-benchmark.</text>
<text x="1104" y="133" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">Network supports curated presets, assembled SimBench codes, custom Python factories and network-plugin YAML.</text>
<text x="1104" y="172" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">Network modifications optionally inject PV sgens and flip selected switches before profile construction.</text>
<text x="1104" y="211" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">Dataset is SimBench native, DWD or custom for non-plugin networks; a network plugin supplies its own profile strategy and therefore skips this prompt.</text>
<text x="1104" y="250" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">The remaining steps select time window, limits/scaling/Q(V), dry-run or hardware mode, live-stream cadence and an optional controller plugin.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Navigation and validation</text>
<text x="1104" y="396" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Menus expose 0 as Back; free-text prompts use &#x27;&lt;&#x27;. Both raise BackRequested to the central loop.</text>
<text x="1104" y="446" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">BackRequested is caught around the current callback; the index is decremented with a floor at zero and the while-loop is re-tested.</text>
<text x="1104" y="496" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">At index 0 the handler prints an already-at-first-step notice, then re-enters Step 1; successful callbacks increment the index.</text>
<text x="1104" y="546" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Prompt-level validation catches ranges and input syntax here; cross-field compatibility and filesystem/runtime checks remain the executor&#x27;s responsibility.</text>
<text x="1104" y="701" text-anchor="start" fill="#111111" font-size="17" font-weight="700">RunPlan data model</text>
<text x="1104" y="742" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">RunPlan nests NetworkConfig, DatasetConfig and ParameterConfig and adds study, hardware, controller-plugin, HC, time-window and output fields.</text>
<text x="1104" y="794" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">The wizard supplies the selected configuration fields; dataclass defaults create the fresh run_id and default output_dir for a newly assembled RunPlan.</text>
<text x="1104" y="846" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">to_dict()/from_dict() provide the JSON serialization boundary used by saved presets and the executor&#x27;s reproducibility copy.</text>
<text x="1104" y="898" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">The data classes are pure configuration containers; runtime decisions remain in wizard.py and executor.py.</text>
</svg>