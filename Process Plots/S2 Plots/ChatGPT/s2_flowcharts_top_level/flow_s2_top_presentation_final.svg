<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Scenario 2 top-level OLTC flow - presentation</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs><style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-hil{fill:none;stroke:#D85A30;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.8;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="28" y="24" width="1060" height="1030" rx="24" fill="#F4F8FB" stroke="#D9E1E8" stroke-width="1.5"/>
<rect x="150.0" y="36" width="700" height="58" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="64" text-anchor="middle" class="node-title" font-size="23" fill="#FFFFFF">run_scenario_2()</text>
<text x="500.0" y="83" text-anchor="middle" class="node-sub" font-size="15" fill="#FFFFFF" opacity="0.90">network, profiles, OLTC options</text>
<rect x="150.0" y="120" width="700" height="66" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="148" text-anchor="middle" class="node-title" font-size="21" fill="#FFFFFF">Prepare simulation</text>
<text x="500.0" y="167" text-anchor="middle" class="node-sub" font-size="14" fill="#FFFFFF" opacity="0.90">adapt_profiles(); publisher start; checkpoint resume</text>
<polygon points="500,206.0 645.0,244 500,282.0 355.0,244" fill="#854F0B"/>
<text x="500" y="249" text-anchor="middle" class="node-title" font-size="20" fill="#FFFFFF">checkpoint covers all T?</text>
<rect x="150.0" y="314" width="700" height="58" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="342" text-anchor="middle" class="node-title" font-size="19" fill="#FFFFFF">Reset network state</text>
<text x="500.0" y="361" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">drop controllers; reset results</text>
<rect x="150.0" y="400" width="700" height="86" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="428" text-anchor="middle" class="node-title" font-size="19" fill="#FFFFFF">Prepare OLTC group</text>
<text x="500.0" y="447" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">select ganged trafos; complete / override / validate tap metadata</text>
<rect x="150.0" y="514" width="700" height="84" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="500.0" y="542" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">Calibrate + initialize tap</text>
<text x="500.0" y="561" text-anchor="middle" class="node-sub" font-size="12.5" fill="#FFFFFF" opacity="0.90">derive gang limits / control buses; two probe PFs -&gt; sign</text>
<text x="500.0" y="578" text-anchor="middle" class="node-sub" font-size="12.5" fill="#FFFFFF" opacity="0.90">resume checkpoint tap or use neutral</text>
<rect x="150.0" y="630" width="700" height="68" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="500.0" y="658" text-anchor="middle" class="node-title" font-size="19" fill="#FFFFFF">Per-timestep OLTC loop</text>
<text x="500.0" y="677" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">tap decision + post-PF / rollback; see detailed figure</text>
<circle cx="500" cy="758" r="15" fill="#5F5E5A"/>
<rect x="150.0" y="792" width="700" height="62" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="820" text-anchor="middle" class="node-title" font-size="19" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="500.0" y="839" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">aggregate resumed + new records</text>
<rect x="150.0" y="876" width="700" height="50" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="904" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">Tap movement summary</text>
<text x="500.0" y="923" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">moves / blocks / observed range</text>
<rect x="150.0" y="946" width="700" height="48" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="500.0" y="974" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">on_scenario_end()</text>
<text x="500.0" y="993" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">checkpoint + final live event</text>
<rect x="150.0" y="1012" width="700" height="40" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="500.0" y="1038.0" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">return ScenarioResult</text>
<path d="M500 94 L500 118" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 186 L500 204" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 282 L500 312" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="518" y="303.0" text-anchor="start" fill="#111111" font-size="14" font-weight="700">no / resume</text>
<path d="M500 372 L500 398" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 486 L500 512" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 598 L500 628" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 698 L500 741" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M355 244 L74 244 L74 758 L483 758" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="339.0" y="233" text-anchor="end" fill="#7A5C12" font-size="14" font-weight="700">yes - skip simulation</text>
<path d="M500 773 L500 790" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 854 L500 874" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 926 L500 944" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M500 994 L500 1010" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1125" y="28" width="760" height="300" rx="18" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1125" y="350" width="760" height="300" rx="18" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1125" y="672" width="760" height="360" rx="18" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1147" y="60" text-anchor="start" fill="#111111" font-size="18" font-weight="700">OLTC group + metadata setup</text>
<text x="1147" y="96" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Selection Tier 1: in-service trafos with vn_hv_kv &gt;= 66 kV.</text>
<text x="1147" y="130" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Tier 2: trafos whose hv_bus is an ext_grid slack bus.</text>
<text x="1147" y="164" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Tier 3: all trafos at the highest available HV voltage level.</text>
<text x="1147" y="198" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Optional completion fills only missing tap fields from benchmark defaults.</text>
<text x="1147" y="232" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">User override is then applied explicitly and may overwrite existing/default values.</text>
<text x="1147" y="266" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Validation enforces shared neutral / side / step %, Ratio type and feasible ganged range.</text>
<text x="1147" y="382" text-anchor="start" fill="#111111" font-size="18" font-weight="700">Tap-sign calibration + resume state</text>
<text x="1147" y="418" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Controlled signal = mean vm_pu across all selected LV-side busbars.</text>
<text x="1147" y="452" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Calibration runs on deepcopy(net), so working-net result tables are untouched.</text>
<text x="1147" y="486" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Probe 1: tap_neutral; Probe 2: neutral +/-1 inside the ganged range.</text>
<text x="1147" y="520" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Observed delta-v determines which tap direction lowers controlled voltage.</text>
<text x="1147" y="554" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">abs(delta-v) &lt; 1e-5 pu is treated as an inactive / invalid tap response.</text>
<text x="1147" y="588" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Partial resume restores current_tap from the last checkpoint record when available.</text>
<text x="1147" y="704" text-anchor="start" fill="#111111" font-size="18" font-weight="700">Checkpoint + lifecycle semantics</text>
<text x="1147" y="742" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">A complete checkpoint returns from resumed records before any OLTC setup or calibration.</text>
<text x="1147" y="781" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">A partial checkpoint repeats OLTC metadata validation + sign calibration, then restores tap_pos.</text>
<text x="1147" y="820" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">There is no S3-style teardown: the controlled transformer group remains at its final tap position.</text>
<text x="1147" y="859" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Setup/calibration exceptions propagate before the timestep loop.</text>
<text x="1147" y="898" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Pre/post/rollback runpp exceptions inside the loop are handled locally as shown in Diagram 2.</text>
<text x="1147" y="937" text-anchor="start" fill="#111111" font-size="12.2" font-weight="600">Finalization builds ScenarioResult, logs tap activity, calls on_scenario_end(), then returns.</text>
</svg>