<polygon points="525,567.0 620.0,585 525,603.0 430.0,585" fill="#854F0B"/>
<text x="525" y="588.162" text-anchor="middle" class="node-title" font-size="9.3" fill="#FFFFFF">run_hc?</text>
<path d="M645 112 L1055 112 L1055 585 L622 585" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="673.0" y="106" text-anchor="middle" fill="#111111" font-size="7.6" font-weight="700">loop done</text>
<rect x="300" y="620" width="450" height="48" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="525.0" y="639.026" text-anchor="middle" class="node-title" font-size="8.9" fill="#FFFFFF">Baseline HC + Volt-Var HC</text>
<text x="525.0" y="655.026" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">successful analysis provides HC results and net_hc</text>
<path d="M525 603 L525 618" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="535" y="614.0" text-anchor="start" fill="#7A5C12" font-size="7.5" font-weight="700">yes</text>
<rect x="40" y="620" width="220" height="48" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="150.0" y="638.754" text-anchor="middle" class="node-title" font-size="8.1" fill="#FFFFFF">HC failure</text>
<text x="150.0" y="654.754" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">hc_error set; net_hc=None; continue</text>
<path d="M300 644 L262 644" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="276" y="638.0" text-anchor="middle" fill="#D85A30" font-size="7.1" font-weight="700">exception</text>
<circle cx="150" cy="700" r="8" fill="#5F5E5A"/>
<path d="M430 585 L30 585 L30 700 L140 700" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="406.0" y="579" text-anchor="middle" fill="#111111" font-size="7.5" font-weight="700">no</text>
<path d="M150 668 L150 690" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="525" cy="700" r="8" fill="#5F5E5A"/>
<path d="M525 668 L525 690" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M158 700 L515 700" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="525,732.0 650.0,752 525,772.0 400.0,752" fill="#854F0B"/>
<text x="525" y="755.128" text-anchor="middle" class="node-title" font-size="9.2" fill="#FFFFFF">HC re-benchmark enabled + net_hc?</text>
<path d="M525 708 L525 730" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="300" y="785" width="450" height="60" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="525.0" y="809.924" text-anchor="middle" class="node-title" font-size="8.6" fill="#FFFFFF">Build HC profiles/config -&gt; recursive run_benchmark</text>
<text x="525.0" y="825.924" text-anchor="middle" class="node-sub" font-size="6.1" fill="#FFFFFF" opacity="0.92">optional HC topology/profile publish; run_hc=False and run_hc_scenarios=False</text>
<path d="M525 772 L525 783" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="535" y="783.0" text-anchor="start" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<rect x="35" y="790" width="235" height="50" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="152.5" y="801.652" text-anchor="middle" class="node-title" font-size="7.8" fill="#FFFFFF">HC-stressed run failed</text>
<text x="152.5" y="817.652" text-anchor="middle" class="node-sub" font-size="5.8" fill="#FFFFFF" opacity="0.92">profile / publish / config / recursive-run error</text>
<text x="152.5" y="833.652" text-anchor="middle" class="node-sub" font-size="5.8" fill="#FFFFFF" opacity="0.92">log error; continue result assembly</text>
<path d="M300 815 L272 815" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="276" y="809.0" text-anchor="middle" fill="#D85A30" font-size="7.1" font-weight="700">exception</text>
<circle cx="525" cy="875" r="8" fill="#5F5E5A"/>
<path d="M525 845 L525 865" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M152.5 840 L152.5 875 L515 875" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M650 752 L930 752 L930 875 L535 875" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="674.0" y="746" text-anchor="middle" fill="#111111" font-size="7.4" font-weight="700">no</text>
<rect x="240" y="902" width="570" height="48" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="525.0" y="921.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">Build comparison_df -&gt; optional CSV -&gt; print summary</text>
<text x="525.0" y="937.094" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">compute total elapsed time; ok / skipped / failed rows remain distinguishable</text>
<rect x="240" y="970" width="570" height="54" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="525.0" y="992.128" text-anchor="middle" class="node-title" font-size="9.2" fill="#FFFFFF">Return BenchmarkResult</text>
<text x="525.0" y="1008.128" text-anchor="middle" class="node-sub" font-size="6.5" fill="#FFFFFF" opacity="0.92">results/errors + comparison + HC and HC-stressed outputs</text>
<path d="M525 883 L525 900" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M525 950 L525 968" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="338" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="686" width="800" height="352" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Scenario isolation and dispatch</text>
<text x="1104" y="92" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Validation runs once before the loop and checks profiles, scenario IDs, hardware settings and HC prerequisites.</text>
<text x="1104" y="131" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">The runner also records whether the network is LV and whether an in-service PV/wind DER fleet already exists.</text>
<text x="1104" y="170" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Configured scenarios run in ascending numeric order; each receives its own copy.deepcopy(net).</text>
<text x="1104" y="209" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">_build_kwargs injects only the hardware, coordination, OPF, publishing and checkpoint options supported by that runner.</text>
<text x="1104" y="248" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">An exception during isolated execution or final publication is stored as a failed result; the next scenario still runs.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Skip, resume and publication layers</text>
<text x="1104" y="394" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Unsupported LV scenarios are skipped only when the LV network also has no controllable PV/wind DERs.</text>
<text x="1104" y="433" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">An existing final scenario JSON can be loaded as a completed summary and that scenario is not rerun.</text>
<text x="1104" y="472" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">If the stored JSON cannot be read, the runner logs a warning and reruns that scenario from scratch.</text>
<text x="1104" y="511" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">When live_csv_path is configured, a callback rewrites a partial benchmark CSV during scenario execution.</text>
<text x="1104" y="550" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">After success, the final scenario JSON is published and any matching checkpoint stream is archived as .completed.</text>
<text x="1104" y="589" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Skip, stored-summary success, normal success and failure all rejoin at the next-scenario loop boundary.</text>
<text x="1104" y="719" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Hosting capacity and result assembly</text>
<text x="1104" y="754" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">After the scenario loop, optional HC evaluates baseline and Volt-Var hosting capacity on the untouched original network.</text>
<text x="1104" y="797" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">HC failure is stored in hc_error, sets net_hc=None and does not abort the outer benchmark.</text>
<text x="1104" y="840" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">If HC-stressed scenarios are enabled and net_hc exists, profile_factory builds profiles for the stressed network.</text>
<text x="1104" y="883" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">The recursive config disables run_hc and run_hc_scenarios so a second HC study cannot recurse indefinitely.</text>
<text x="1104" y="926" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">HC-stressed setup/run failure is logged; comparison assembly still proceeds.</text>
<text x="1104" y="969" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">Finally, the runner builds comparison_df, optionally writes CSV, prints the summary and returns BenchmarkResult.</text>
</svg>