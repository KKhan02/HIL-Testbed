<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1210" viewBox="0 0 1120 1210">
<title>Hosting capacity baseline sweep - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="1092" height="1182" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="560.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Hosting Capacity - Baseline Sweep (Case A, no voltage control)</text>
<rect x="260" y="60" width="660" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="590.0" y="85.08" text-anchor="middle" class="node-title" font-size="12.0" fill="#FFFFFF">run_baseline_hc(net, network_id, runpp_kwargs)</text>
<text x="590.0" y="101.08" text-anchor="middle" class="node-sub" font-size="8.4" fill="#FFFFFF" opacity="0.92">caller network is not modified</text>
<rect x="240" y="145" width="700" height="76" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="590.0" y="170.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">Deep-copy network + build runpp kwargs</text>
<text x="590.0" y="186.672" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">algorithm=&#x27;nr&#x27;; voltage_depend_loads=False is always enforced</text>
<text x="590.0" y="202.672" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">infer modal distribution voltage; select MV/LV HC_PARAMS</text>
<path d="M590 118 L590 143" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="220" y="248" width="740" height="90" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="590.0" y="272.604" text-anchor="middle" class="node-title" font-size="10.6" fill="#FFFFFF">Prepare deterministic worst-case HC snapshot</text>
<text x="590.0" y="288.604" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">end-of-feeder = farthest reachable distribution-level bus from slack</text>
<text x="590.0" y="304.604" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">load P/Q *= 0.1; existing in-service sgens set to inferred rated P; all existing Q=0</text>
<text x="590.0" y="320.604" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">initialize HC/result metrics, step_mw and total_mw</text>
<path d="M590 221 L590 246" class="edge-dark" marker-end="url(#arrowDark)"/>
<circle cx="590" cy="365" r="10" fill="#5F5E5A"/>
<path d="M590 338 L590 353" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="590,389.0 740.0,420 590,451.0 440.0,420" fill="#854F0B"/>
<text x="590" y="423.74" text-anchor="middle" class="node-title" font-size="11.0" fill="#FFFFFF">total_mw &lt;= params[&#x27;max&#x27;]?</text>
<path d="M590 375 L590 387" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="780" y="387" width="260" height="66" rx="9" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="910.0" y="415.196" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">Sweep completed without break</text>
<text x="910.0" y="431.196" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">hc_limit_reached=True; retain last accepted hc_mw</text>
<path d="M740 420 L778 420" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="760.0" y="412" text-anchor="middle" fill="#7A5C12" font-size="7.8" font-weight="700">no - loop exhausted</text>
<rect x="390" y="480" width="400" height="68" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="590.0" y="509.434" text-anchor="middle" class="node-title" font-size="10.1" fill="#FFFFFF">Add one PV sgen at end-of-feeder</text>
<text x="590.0" y="525.434" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">p_mw=step_mw, q_mvar=0; increment total_mw and round to 6 decimals</text>
<path d="M590 451 L590 478" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="606" y="466.0" text-anchor="start" fill="#7A5C12" font-size="8.3" font-weight="700">yes - next step</text>
<rect x="390" y="575" width="400" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="590.0" y="599.604" text-anchor="middle" class="node-title" font-size="10.6" fill="#FFFFFF">try pp.runpp(net, **kwargs)</text>
<text x="590.0" y="615.604" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">evaluate the incremented snapshot</text>
<path d="M590 548 L590 573" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="590,661.0 725.0,690 590,719.0 455.0,690" fill="#854F0B"/>
<text x="590" y="693.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">runpp succeeded?</text>
<path d="M590 633 L590 659" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="60" y="657" width="280" height="66" rx="9" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="200.0" y="685.128" text-anchor="middle" class="node-title" font-size="9.2" fill="#FFFFFF">Treat PF failure as violating step</text>
<text x="200.0" y="701.128" text-anchor="middle" class="node-sub" font-size="6.7" fill="#FFFFFF" opacity="0.92">violated_at_mw=total_mw; binding=-1/NaN; drop last-added sgen; break</text>
<path d="M455 690 L342 690" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="397.5" y="682" text-anchor="middle" fill="#D85A30" font-size="8.0" font-weight="700">no / exception</text>
<rect x="390" y="750" width="400" height="58" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="590.0" y="774.502" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">report = detect_violations(net)</text>
<text x="590.0" y="790.502" text-anchor="middle" class="node-sub" font-size="7.5" fill="#FFFFFF" opacity="0.92">voltage violation detector on solved snapshot</text>
<path d="M590 719 L590 748" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="604" y="733.0" text-anchor="start" fill="#111111" font-size="8.2" font-weight="700">yes</text>
<polygon points="590,835.0 730.0,865 590,895.0 450.0,865" fill="#854F0B"/>
<text x="590" y="868.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">report.any_violations?</text>
<path d="M590 808 L590 833" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="55" y="829" width="305" height="72" rx="9" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="207.5" y="860.196" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">Record first violating step</text>
<text x="207.5" y="876.196" text-anchor="middle" class="node-sub" font-size="6.8" fill="#FFFFFF" opacity="0.92">extract binding bus/vm; append sweep point; drop last-added sgen; break</text>
<path d="M450 865 L362 865" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="405.0" y="857" text-anchor="middle" fill="#D85A30" font-size="8.2" font-weight="700">yes</text>
<rect x="390" y="925" width="400" height="68" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="590.0" y="954.4" text-anchor="middle" class="node-title" font-size="10.0" fill="#FFFFFF">Accept violation-free increment</text>
<text x="590.0" y="970.4" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">hc_mw=total_mw; append {mw, max_vm_pu} to sweep_curve</text>
<path d="M590 895 L590 923" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="604" y="909.0" text-anchor="start" fill="#111111" font-size="8.2" font-weight="700">no</text>
<circle cx="207.5" cy="1040" r="10" fill="#5F5E5A"/>
<path d="M207.5 901 L207.5 1028" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M60 690 L30 690 L30 1040 L195.5 1040" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="590" cy="1040" r="10" fill="#5F5E5A"/>
<path d="M217.5 1040 L578 1040" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M910 453 L910 1040 L602 1040" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M790 959 L1060 959 L1060 365 L602 365" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="1052" y="949.0" text-anchor="end" fill="#3D8FD9" font-size="8.0" font-weight="700">next step</text>
<rect x="270" y="1080" width="640" height="86" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="590.0" y="1110.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">Return (HCResult, net at last violation-free capacity)</text>
<text x="590.0" y="1126.638" text-anchor="middle" class="node-sub" font-size="7.6" fill="#FFFFFF" opacity="0.92">HCResult: hc_mw, violated_at, binding bus/vm, n_steps, limit flag, sweep_curve</text>
<text x="590.0" y="1142.638" text-anchor="middle" class="node-sub" font-size="7.6" fill="#FFFFFF" opacity="0.92">on violation/PF failure, the last-added PV increment is removed</text>
<path d="M590 1050 L590 1078" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>