<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1360" viewBox="0 0 840 1360"><title>Scenario 2 top-level OLTC flow - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
</defs><style>
text {font-family:Helvetica,Arial,sans-serif} .node-title{font-weight:700} .node-sub{font-weight:400}
.edge-dark{fill:none;stroke:#263238;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-hil{fill:none;stroke:#D85A30;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.edge-gate{fill:none;stroke:#7A5C12;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-loop{fill:none;stroke:#3D8FD9;stroke-width:2.8;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc{fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="28" y="24" width="784" height="1312" rx="20" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="2"/>
<text x="420.0" y="58" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">Scenario 2 - Top-Level OLTC Flow</text>
<rect x="215.0" y="86" width="430" height="64" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="430.0" y="114" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">run_scenario_2()</text>
<text x="430.0" y="133" text-anchor="middle" class="node-sub" font-size="12.5" fill="#FFFFFF" opacity="0.90">network, profiles, voltage limits, tap options</text>
<rect x="215.0" y="180" width="430" height="82" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="430.0" y="208" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Prepare simulation</text>
<text x="430.0" y="227" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">adapt_profiles(); on_scenario_start()</text>
<text x="430.0" y="244" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">get_resume_records() -&gt; start_t</text>
<polygon points="430,285.0 545.0,326 430,367.0 315.0,326" fill="#854F0B"/>
<text x="430" y="331" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">checkpoint covers all T?</text>
<rect x="215.0" y="410" width="430" height="66" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="430.0" y="438" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">Reset network state</text>
<text x="430.0" y="457" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">drop stale controllers; pp.reset_results()</text>
<rect x="215.0" y="508" width="430" height="112" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="430.0" y="536" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">Prepare OLTC group</text>
<text x="430.0" y="555" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">select trafos; print original metadata</text>
<text x="430.0" y="572" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">optional default completion + user override</text>
<text x="430.0" y="589" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">print final metadata; validate ganged tap data</text>
<rect x="215.0" y="654" width="430" height="100" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="430.0" y="682" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">Calibrate + initialize tap state</text>
<text x="430.0" y="701" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">derive gang limits / neutral + controlled buses</text>
<text x="430.0" y="718" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">deep-copy probe PFs -&gt; tap sign</text>
<text x="430.0" y="735" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">resume last tap_pos or start at neutral</text>
<rect x="215.0" y="792" width="430" height="80" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="430.0" y="820" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">Per-timestep OLTC loop</text>
<text x="430.0" y="839" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">pre-PF -&gt; tap decision -&gt; optional post-PF / rollback</text>
<text x="430.0" y="856" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">record / publish; see Diagram 2</text>
<circle cx="430" cy="936" r="14" fill="#5F5E5A"/>
<rect x="215.0" y="982" width="430" height="78" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="430.0" y="1010" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="430.0" y="1029" text-anchor="middle" class="node-sub" font-size="11.5" fill="#FFFFFF" opacity="0.90">aggregate resumed + newly simulated records</text>
<rect x="215.0" y="1092" width="430" height="66" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="430.0" y="1120" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">Tap activity summary</text>
<text x="430.0" y="1139" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">moves; blocked actions; min / max tap seen</text>
<rect x="215.0" y="1190" width="430" height="62" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="430.0" y="1218" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">on_scenario_end()</text>
<text x="430.0" y="1237" text-anchor="middle" class="node-sub" font-size="11" fill="#FFFFFF" opacity="0.90">close checkpoint; final live event</text>
<rect x="215.0" y="1280" width="430" height="42" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="430.0" y="1307.0" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">return ScenarioResult</text>
<path d="M430 150 L430 178" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 262 L430 283" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 367 L430 408" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="444" y="386.0" text-anchor="start" fill="#111111" font-size="11" font-weight="700">no / resume</text>
<path d="M430 476 L430 506" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 620 L430 652" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 754 L430 790" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 872 L430 920" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M315 326 L78 326 L78 936 L414 936" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="303.0" y="316" text-anchor="end" fill="#7A5C12" font-size="11" font-weight="700">yes - skip simulation</text>
<path d="M430 950 L430 980" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 1060 L430 1090" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 1158 L430 1188" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M430 1252 L430 1278" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>