<text x="340.0" y="208" text-anchor="end" fill="#D85A30" font-size="11" font-weight="700">no</text>
<rect x="180" y="272" width="580" height="40" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="470.0" y="297.0" text-anchor="middle" class="node-title" font-size="14" fill="#FFFFFF">[3] read vm_svc at fixed SVC bus</text>
