<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1060" viewBox="0 0 780 1060">
<title>Scenario 5 top-level AC OPF flow - IEEE</title>
<defs>
  <marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
  <marker id="arrowWhite" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#FFFFFF"/></marker>
  <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
  <marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
  <marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
</defs>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
.node-title { font-weight:700; } .node-sub { font-weight:400; }
.edge-dark { fill:none; stroke:#263238; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-white { fill:none; stroke:#FFFFFF; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-red { fill:none; stroke:#D85A30; stroke-width:3.0; stroke-linejoin:round; stroke-linecap:round; }
.edge-gate { fill:none; stroke:#7A5C12; stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
.edge-loop { fill:none; stroke:#3D8FD9; stroke-width:2.8; stroke-dasharray:7 5; stroke-linejoin:round; stroke-linecap:round; }
</style>
<rect x="42" y="32" width="696" height="996" rx="20" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="2"/>
<text x="390.0" y="68" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">Scenario 5 - Top-Level AC OPF Flow</text>
<rect x="180.0" y="98" width="420" height="70" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390.0" y="126" text-anchor="middle" class="node-title" font-size="18" fill="#FFFFFF">run_scenario_5()</text>
<text x="390.0" y="145" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">network, profiles, OPF limits / options</text>
<rect x="180.0" y="198" width="420" height="90" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390.0" y="226" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Prepare simulation</text>
<text x="390.0" y="245" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">continuous bus index + adapt profiles</text>
<text x="390.0" y="262" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">publisher start + checkpoint resume</text>
<rect x="180.0" y="318" width="420" height="100" rx="14" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="390.0" y="346" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Prepare OPF model</text>
<text x="390.0" y="365" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">clear controllers / results; static OPF bounds</text>
<text x="390.0" y="382" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">PF options; diagnostic; derive sn_rated</text>
<polygon points="390,447.0 485.0,486 390,525.0 295.0,486" fill="#854F0B"/>
<text x="390" y="491" text-anchor="middle" class="node-title" font-size="15" fill="#FFFFFF">checkpoint complete?</text>
<rect x="180.0" y="566" width="420" height="82" rx="14" fill="#5F5E5A" stroke="none" stroke-width="0"/>
<text x="390.0" y="594" text-anchor="middle" class="node-title" font-size="17" fill="#FFFFFF">Per-timestep OPF loop</text>
<text x="390.0" y="613" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">state build + runopp + record / publish</text>
<text x="390.0" y="630" text-anchor="middle" class="node-sub" font-size="13" fill="#FFFFFF" opacity="0.90">see Diagram 2</text>
<circle cx="390" cy="714" r="14" fill="#5F5E5A"/>
<rect x="180.0" y="758" width="420" height="78" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="390.0" y="786" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">ScenarioResult.from_records()</text>
<text x="390.0" y="805" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">aggregate resumed + newly simulated records</text>
<rect x="180.0" y="868" width="420" height="66" rx="14" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="390.0" y="896" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">on_scenario_end()</text>
<text x="390.0" y="915" text-anchor="middle" class="node-sub" font-size="12" fill="#FFFFFF" opacity="0.90">final live event / elapsed persistence</text>
<rect x="180.0" y="966" width="420" height="48" rx="14" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="390.0" y="996.0" text-anchor="middle" class="node-title" font-size="16" fill="#FFFFFF">return ScenarioResult</text>
<path d="M390 168 L390 196" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 288 L390 316" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 418 L390 445" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 525 L390 564" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="402" y="545.0" text-anchor="start" fill="#111111" font-size="11" font-weight="700">no</text>
<path d="M390 648 L390 698" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M295 486 L104 486 L104 714 L374 714" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="285.0" y="476" text-anchor="end" fill="#7A5C12" font-size="11" font-weight="700">yes - skip loop</text>
<path d="M390 728 L390 756" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 836 L390 866" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M390 934 L390 964" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>