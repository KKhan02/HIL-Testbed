<path d="M410 280 L410 314" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 382 L410 416" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 506 L410 540" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 624 L410 662" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 758 L410 798" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 876 L410 914" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M410 982 L410 1018" class="edge-dark" marker-end="url(#arrowDark)"/>
</svg>