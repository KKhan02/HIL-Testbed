<text x="515" y="459.0" text-anchor="start" fill="#7A5C12" font-size="7.3" font-weight="700">yes</text>
<circle cx="505" cy="565" r="8" fill="#5F5E5A"/>
<path d="M505 534 L505 555" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M620 430 L950 430 L950 565 L515 565" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="644.0" y="423" text-anchor="middle" fill="#111111" font-size="7.3" font-weight="700">no</text>
<rect x="295" y="600" width="420" height="50" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="505.0" y="619.958" text-anchor="middle" class="node-title" font-size="8.7" fill="#FFFFFF">Mandatory final runpp with current Q</text>
<text x="505.0" y="635.958" text-anchor="middle" class="node-sub" font-size="6.1" fill="#FFFFFF" opacity="0.92">post-Q snapshot used for the HC violation decision</text>
<path d="M505 573 L505 598" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="505,670.0 620.0,690 505,710.0 390.0,690" fill="#854F0B"/>
<text x="505" y="693.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">final runpp succeeded?</text>
<path d="M505 650 L505 668" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="40" y="667" width="270" height="46" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="175.0" y="684.686" text-anchor="middle" class="node-title" font-size="7.9" fill="#FFFFFF">Treat final PF failure as violation</text>
<text x="175.0" y="700.686" text-anchor="middle" class="node-sub" font-size="5.7" fill="#FFFFFF" opacity="0.92">record violated_at; no binding report; stop sweep</text>
<path d="M390 690 L312 690" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="350.0" y="683" text-anchor="middle" fill="#D85A30" font-size="7.3" font-weight="700">no</text>
<rect x="295" y="735" width="420" height="46" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="505.0" y="752.924" text-anchor="middle" class="node-title" font-size="8.6" fill="#FFFFFF">report = detect_violations(net)</text>
<text x="505.0" y="768.924" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">inspect the solved post-Q snapshot</text>
<path d="M505 710 L505 733" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="515" y="721.0" text-anchor="start" fill="#111111" font-size="7.3" font-weight="700">yes</text>
<polygon points="505,805.0 620.0,825 505,845.0 390.0,825" fill="#854F0B"/>
<text x="505" y="828.128" text-anchor="middle" class="node-title" font-size="9.2" fill="#FFFFFF">report.any_violations?</text>
<path d="M505 781 L505 803" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="40" y="802" width="270" height="46" rx="8" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="175.0" y="819.686" text-anchor="middle" class="node-title" font-size="7.9" fill="#FFFFFF">Record violating step and stop</text>
<text x="175.0" y="835.686" text-anchor="middle" class="node-sub" font-size="5.7" fill="#FFFFFF" opacity="0.92">extract binding bus/vm and append violating sweep point</text>
<path d="M390 825 L312 825" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="350.0" y="818" text-anchor="middle" fill="#D85A30" font-size="7.3" font-weight="700">yes</text>
<rect x="295" y="860" width="420" height="50" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="505.0" y="879.89" text-anchor="middle" class="node-title" font-size="8.5" fill="#FFFFFF">Accept step + append sweep point</text>
<text x="505.0" y="895.89" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">hc_mw=total_mw; append {mw, max_vm_pu}</text>
<path d="M505 845 L505 858" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="515" y="856.0" text-anchor="start" fill="#7A5C12" font-size="7.3" font-weight="700">no</text>
<circle cx="175.0" cy="950" r="8" fill="#5F5E5A"/>
<path d="M175 848 L175 940" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M40 690 L18 690 L18 950 L165 950" class="edge-hil" marker-end="url(#arrowHil)"/>
<circle cx="505" cy="950" r="8" fill="#5F5E5A"/>
<path d="M183 950 L495 950" class="edge-hil" marker-end="url(#arrowHil)"/>
<path d="M850 327 L850 950 L515 950" class="edge-gate" marker-end="url(#arrowGate)"/>
<path d="M715 885 L1010 885 L1010 258 L515 258" class="edge-loop" marker-end="url(#arrowLoop)"/>
<text x="1002" y="877.0" text-anchor="end" fill="#3D8FD9" font-size="7.2" font-weight="700">next PV step</text>
<rect x="230" y="985" width="550" height="54" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="505.0" y="1007.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">Return Volt-Var HCResult</text>
<text x="505.0" y="1023.094" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">hc_mw + binding/limit metrics + qv_converged and qv_iters_max</text>
<path d="M505 958 L505 983" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="280" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="326" width="800" height="330" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="678" width="800" height="360" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Volt-Var HC setup</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Case B uses the same deep-copy, voltage-class, end-of-feeder and deterministic worst-case snapshot preparation as baseline HC.</text>
<text x="1104" y="142" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">VoltVarController is configured in dry-run mode before the HC sweep begins, using the same local Q(V) and inverter-limit logic as Scenario 4.</text>
<text x="1104" y="190" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Because the controller resolves its sgen_indices at configuration time, PV capacity added later by the HC sweep is not Q-controlled.</text>
<text x="1104" y="238" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Only the pre-existing controlled DER fleet supplies reactive support while incremental PV is tested at unity power factor.</text>
<text x="1104" y="359" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Q(V) fixed-point inside each HC step</text>
<text x="1104" y="396" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">When controlled DERs exist, their Q is reset to zero and _qv_converge iterates up to MAX_QV_ITERS=10.</text>
<text x="1104" y="441" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Each inner iteration runs a power flow, reads DER-bus voltages, computes Q(V), clamps to network/inverter limits and writes the new Q.</text>
<text x="1104" y="486" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">Convergence requires max|q_new-q_prev| &lt; 1e-4 MVAr; non-convergence is logged and the last iterate is retained.</text>
<text x="1104" y="531" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">qv_converged and qv_iters_max are updated immediately after the inner function returns, before the final power flow.</text>
<text x="1104" y="576" text-anchor="start" fill="#111111" font-size="10.6" font-weight="600">The caller then always performs a final runpp; if no controlled DERs exist, the inner Q(V) loop is simply skipped.</text>
<text x="1104" y="711" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Result semantics</text>
<text x="1104" y="748" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">A final-PF failure terminates the sweep without a voltage binding report; a solved violating snapshot records the binding bus and voltage.</text>
<text x="1104" y="802" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Every clean snapshot becomes the latest hc_mw and contributes one {mw, max_vm_pu} point to sweep_curve.</text>
<text x="1104" y="856" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">Unlike baseline HC, Case B returns HCResult only; its deep-copied working network remains internal to the analysis.</text>
<text x="1104" y="910" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The benchmark runner compares Case B hc_mw against baseline hc_mw to quantify the hosting-capacity gain from the existing controllable DER fleet.</text>
</svg>