<text x="505.0" y="503.924" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">up to 10 iterations: runpp -&gt; Q(V) -&gt; clamp -&gt; apply</text>
<text x="505.0" y="519.924" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">update qv_converged/qv_iters_max; warn and retain last iterate if needed</text>
