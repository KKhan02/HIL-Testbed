<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Network plugin profile strategy - presentation</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F8FAFC" stroke="none" stroke-width="0"/>
<rect x="160" y="18" width="700" height="46" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="510.0" y="36.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">_build_profiles_for_strategy(net, cfg)</text>
<text x="510.0" y="52.672" text-anchor="middle" class="node-sub" font-size="7.3" fill="#FFFFFF" opacity="0.92">select configured profile strategy for the supplied network</text>
<polygon points="510,101.0 660.0,125 510,149.0 360.0,125" fill="#854F0B"/>
<text x="510" y="128.264" text-anchor="middle" class="node-title" font-size="9.6" fill="#FFFFFF">simbench_native requested AND metadata absent?</text>
<path d="M510 64 L510 99" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="720" y="101" width="280" height="48" rx="8" fill="#3B6D11" stroke="none" stroke-width="0"/>
<text x="860.0" y="119.856" text-anchor="middle" class="node-title" font-size="8.4" fill="#FFFFFF">Warn + use dwd_pvlib</text>
<text x="860.0" y="135.856" text-anchor="middle" class="node-sub" font-size="6.1" fill="#FFFFFF" opacity="0.92">requested strategy remains recorded in metadata</text>
<path d="M660 125 L718 125" class="edge-dry" marker-end="url(#arrowDry)"/>
<text x="690.0" y="118" text-anchor="middle" fill="#3B6D11" font-size="7.5" font-weight="700">yes</text>
<circle cx="510" cy="185" r="8" fill="#5F5E5A"/>
<path d="M510 149 L510 175" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="520" y="160.0" text-anchor="start" fill="#111111" font-size="7.4" font-weight="700">no</text>
<path d="M860 149 L860 185 L520 185" class="edge-dry" marker-end="url(#arrowDry)"/>
<polygon points="510,225.0 625.0,245 510,265.0 395.0,245" fill="#854F0B"/>
<text x="510" y="248.23" text-anchor="middle" class="node-title" font-size="9.5" fill="#FFFFFF">strategy == simbench_native?</text>
<path d="M510 193 L510 223" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="45" y="217" width="320" height="56" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="205.0" y="239.822" text-anchor="middle" class="node-title" font-size="8.3" fill="#FFFFFF">SimBench native profiles</text>
<text x="205.0" y="255.822" text-anchor="middle" class="node-sub" font-size="5.9" fill="#FFFFFF" opacity="0.92">absolute values; rebuild time index if needed; masks/night-zero/clip/extremes</text>
<path d="M395 245 L367 245" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="380.0" y="238" text-anchor="middle" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<polygon points="510,294.0 650.0,315 510,336.0 370.0,315" fill="#854F0B"/>
<text x="510" y="318.196" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">dwd_pvlib OR custom?</text>
<path d="M510 265 L510 292" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="520" y="276.0" text-anchor="start" fill="#111111" font-size="7.4" font-weight="700">no</text>
<rect x="710" y="289" width="300" height="52" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="860.0" y="309.89" text-anchor="middle" class="node-title" font-size="8.5" fill="#FFFFFF">DWD/pvlib profile path</text>
<text x="860.0" y="325.89" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">build_annual_profiles; custom passes file_map/col_map hooks</text>
<path d="M650 315 L708 315" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="680.0" y="308" text-anchor="middle" fill="#7A5C12" font-size="7.4" font-weight="700">yes</text>
<rect x="320" y="365" width="380" height="56" rx="8" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="510.0" y="387.89" text-anchor="middle" class="node-title" font-size="8.5" fill="#FFFFFF">Flat full-year profiles</text>
<text x="510.0" y="403.89" text-anchor="middle" class="node-sub" font-size="6.0" fill="#FFFFFF" opacity="0.92">15-min constant load and PV/wind rated P; leap-aware; extremes</text>
<path d="M510 336 L510 363" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="520" y="347.0" text-anchor="start" fill="#111111" font-size="7.2" font-weight="700">no -&gt; flat</text>
<circle cx="510" cy="455" r="9" fill="#5F5E5A"/>
<path d="M205 273 L205 455 L499 455" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M860 341 L860 455 L521 455" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M510 421 L510 444" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="220" y="485" width="580" height="50" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="510.0" y="505.196" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">return profiles + strategy actually used</text>
<text x="510.0" y="521.196" text-anchor="middle" class="node-sub" font-size="6.7" fill="#FFFFFF" opacity="0.92">actual strategy is stored in plugin_meta</text>
<path d="M510 464 L510 483" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="145" y="605" width="730" height="50" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="510.0" y="625.196" text-anchor="middle" class="node-title" font-size="9.4" fill="#FFFFFF">make_profile_factory(yaml): parse cfg once -&gt; return _factory(net_hc)</text>
<text x="510.0" y="641.196" text-anchor="middle" class="node-sub" font-size="6.6" fill="#FFFFFF" opacity="0.92">used by the HC-stressed recursive benchmark</text>
<rect x="165" y="710" width="690" height="54" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="510.0" y="732.06" text-anchor="middle" class="node-title" font-size="9.0" fill="#FFFFFF">_factory calls _build_profiles_for_strategy(net_hc, cfg)</text>
<text x="510.0" y="748.06" text-anchor="middle" class="node-sub" font-size="6.4" fill="#FFFFFF" opacity="0.92">configured strategy and simbench_native fallback behavior are preserved</text>
<rect x="175" y="820" width="670" height="60" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="510.0" y="845.026" text-anchor="middle" class="node-title" font-size="8.9" fill="#FFFFFF">Attach HC-stressed plugin_meta</text>
<text x="510.0" y="861.026" text-anchor="middle" class="node-sub" font-size="6.3" fill="#FFFFFF" opacity="0.92">name gets &#x27;_hc_stressed&#x27;; actual and requested strategy remain explicit</text>
<rect x="220" y="935" width="580" height="48" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="510.0" y="954.094" text-anchor="middle" class="node-title" font-size="9.1" fill="#FFFFFF">return rebuilt profiles</text>
<text x="510.0" y="970.094" text-anchor="middle" class="node-sub" font-size="6.5" fill="#FFFFFF" opacity="0.92">fresh profiles for the HC-stressed network</text>
<path d="M510 655 L510 708" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M510 764 L510 818" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M510 880 L510 933" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="1080" y="24" width="800" height="270" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="316" width="800" height="330" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<rect x="1080" y="668" width="800" height="370" rx="16" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2"/>
<text x="1104" y="57" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Strategy selection and fallback</text>
<text x="1104" y="94" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">Profile construction begins from cfg[&#x27;strategy&#x27;]; the same configuration is retained when profiles are later rebuilt for net_hc.</text>
<text x="1104" y="137" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">Only simbench_native has a runtime fallback: missing net.profiles metadata logs a warning and switches the actual strategy to dwd_pvlib.</text>
<text x="1104" y="180" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">requested_strategy remains unchanged in plugin_meta, while strategy records what was actually executed.</text>
<text x="1104" y="223" text-anchor="start" fill="#111111" font-size="10.8" font-weight="600">After fallback handling, the code follows the exact if / elif / else dispatch shown in the execution graph.</text>
<text x="1104" y="349" text-anchor="start" fill="#111111" font-size="17" font-weight="700">Strategy implementations</text>
<text x="1104" y="386" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">simbench_native uses sb.get_absolute_values on the already-loaded network.</text>
<text x="1104" y="425" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">If its time axis is not a DatetimeIndex, a configured-year 15-minute index is rebuilt.</text>
<text x="1104" y="464" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">PV/wind masks, night-time PV zeroing, non-negative clipping and extreme-day detection are then applied.</text>
<text x="1104" y="503" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">dwd_pvlib calls build_annual_profiles with the configured/default DWD data directory and a safe network name.</text>
<text x="1104" y="542" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">custom is valid and uses the same DWD builder with YAML file_map/col_map hooks.</text>
<text x="1104" y="581" text-anchor="start" fill="#111111" font-size="10.5" font-weight="600">flat repeats load.p_mw and PV/wind sgen.p_mw over a leap-aware full-year 15-minute index.</text>
<text x="1104" y="701" text-anchor="start" fill="#111111" font-size="17" font-weight="700">HC-stressed profile factory</text>
<text x="1104" y="738" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">make_profile_factory parses the YAML once when the factory is created and returns a callable for a later stressed network.</text>
<text x="1104" y="788" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">When invoked with net_hc, the closure calls _build_profiles_for_strategy(net_hc, cfg) using the configured strategy.</text>
<text x="1104" y="838" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">This rebuilds profile columns from the stressed network where the selected strategy supports them and preserves fallback behavior.</text>
<text x="1104" y="888" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The returned metadata adds &#x27;_hc_stressed&#x27; to the name and preserves source, requested strategy, limits, notes and YAML path.</text>
<text x="1104" y="938" text-anchor="start" fill="#111111" font-size="10.7" font-weight="600">The actual stressed-network strategy is recorded separately in case simbench_native had to fall back.</text>
</svg>