<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1220" viewBox="0 0 1100 1220">
<title>Network plugin loader and validator - IEEE</title>
<defs>
<marker id="arrowDark" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/></marker>
<marker id="arrowHil" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/></marker>
<marker id="arrowGate" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A5C12"/></marker>
<marker id="arrowLoop" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#3D8FD9"/></marker>
<marker id="arrowAssoc" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A887F"/></marker>
<marker id="arrowDry" markerWidth="6" markerHeight="6" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#6B9E26"/></marker>
</defs>
<style>
text {font-family:Helvetica,Arial,sans-serif}
.node-title {font-weight:700}
.node-sub {font-weight:400}
.edge-dark {fill:none;stroke:#263238;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-hil {fill:none;stroke:#D85A30;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.edge-gate {fill:none;stroke:#7A5C12;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.edge-loop {fill:none;stroke:#3D8FD9;stroke-width:2.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round}
.edge-assoc {fill:none;stroke:#8A887F;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.edge-dry {fill:none;stroke:#6B9E26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect x="14" y="14" width="1072" height="1192" rx="16" fill="#F8FAFC" stroke="#D9E1E8" stroke-width="1.5"/>
<text x="550.0" y="38" text-anchor="middle" fill="#111111" font-size="17" font-weight="700">Network Plugin - YAML Load, Network Source and Public Validation</text>
<rect x="250" y="62" width="600" height="58" rx="12" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="550.0" y="87.25" text-anchor="middle" class="node-title" font-size="12.5" fill="#FFFFFF">load_network_from_yaml(yaml_path)</text>
<text x="550.0" y="103.25" text-anchor="middle" class="node-sub" font-size="8.8" fill="#FFFFFF" opacity="0.92">resolve user path to absolute Path</text>
<rect x="230" y="150" width="640" height="92" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="550.0" y="175.808" text-anchor="middle" class="node-title" font-size="11.2" fill="#FFFFFF">_load_yaml_config(yaml_path)</text>
<text x="550.0" y="191.808" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">parse YAML mapping; validate name/label and source; resolve source paths relative to YAML</text>
<text x="550.0" y="207.808" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">validate strategy in {simbench_native, dwd_pvlib, flat, custom}, year and custom file_map</text>
<text x="550.0" y="223.808" text-anchor="middle" class="node-sub" font-size="7.7" fill="#FFFFFF" opacity="0.92">resolve optional data_dir; validate 0.5 &lt;= v_min &lt; v_max &lt;= 1.5</text>
<path d="M550 120 L550 148" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="550,271.0 675.0,300 550,329.0 425.0,300" fill="#854F0B"/>
<text x="550" y="303.74" text-anchor="middle" class="node-title" font-size="11.0" fill="#FFFFFF">cfg[&#x27;source&#x27;] == &#x27;json&#x27;?</text>
<path d="M550 242 L550 269" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="60" y="271" width="280" height="58" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="200.0" y="295.502" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">pandapower.from_json(path)</text>
<text x="200.0" y="311.502" text-anchor="middle" class="node-sub" font-size="7.5" fill="#FFFFFF" opacity="0.92">JSON source</text>
<path d="M425 300 L342 300" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="382.5" y="292" text-anchor="middle" fill="#7A5C12" font-size="8.5" font-weight="700">yes</text>
<polygon points="550,366.0 675.0,395 550,424.0 425.0,395" fill="#854F0B"/>
<text x="550" y="398.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">cfg[&#x27;source&#x27;] == &#x27;pickle&#x27;?</text>
<path d="M550 329 L550 364" class="edge-dark" marker-end="url(#arrowDark)"/>
<text x="565" y="344.0" text-anchor="start" fill="#111111" font-size="8.4" font-weight="700">no</text>
<rect x="60" y="366" width="280" height="58" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="200.0" y="390.366" text-anchor="middle" class="node-title" font-size="9.9" fill="#FFFFFF">pandapower.from_pickle(path)</text>
<text x="200.0" y="406.366" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.92">pandapower-managed pickle source</text>
<path d="M425 395 L342 395" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="382.5" y="387" text-anchor="middle" fill="#7A5C12" font-size="8.5" font-weight="700">yes</text>
<rect x="720" y="362" width="320" height="66" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="880.0" y="390.332" text-anchor="middle" class="node-title" font-size="9.8" fill="#FFFFFF">Import loader file + call zero-arg function</text>
<text x="880.0" y="406.332" text-anchor="middle" class="node-sub" font-size="7.2" fill="#FFFFFF" opacity="0.92">_import_loader_fn(module_path, function); net = fn()</text>
<path d="M675 395 L718 395" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="697.5" y="387" text-anchor="middle" fill="#7A5C12" font-size="8.0" font-weight="700">no -&gt; function</text>
<circle cx="550" cy="505" r="12" fill="#5F5E5A"/>
<path d="M60 300 L30 300 L30 505 L536 505" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M200 424 L200 460 L550 460 L550 491" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M880 428 L880 505 L564 505" class="edge-dark" marker-end="url(#arrowDark)"/>
<polygon points="550,556.0 680.0,585 550,614.0 420.0,585" fill="#854F0B"/>
<text x="550" y="588.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">result is pandapowerNet?</text>
<path d="M550 517 L550 554" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="735" y="556" width="305" height="58" rx="9" fill="#993C1D" stroke="none" stroke-width="0"/>
<text x="887.5" y="580.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">Raise TypeError</text>
<text x="887.5" y="596.298" text-anchor="middle" class="node-sub" font-size="7.0" fill="#FFFFFF" opacity="0.92">function/source did not produce pandapowerNet</text>
<path d="M680 585 L733 585" class="edge-hil" marker-end="url(#arrowHil)"/>
<text x="707.5" y="577" text-anchor="middle" fill="#D85A30" font-size="8.4" font-weight="700">no</text>
<rect x="250" y="650" width="600" height="66" rx="12" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="550.0" y="678.672" text-anchor="middle" class="node-title" font-size="10.8" fill="#FFFFFF">_build_profiles_for_strategy(net, cfg)</text>
<text x="550.0" y="694.672" text-anchor="middle" class="node-sub" font-size="7.8" fill="#FFFFFF" opacity="0.92">returns profiles + strategy actually used; detailed in Diagram 2</text>
<path d="M550 614 L550 648" class="edge-gate" marker-end="url(#arrowGate)"/>
<text x="565" y="629.0" text-anchor="start" fill="#7A5C12" font-size="8.4" font-weight="700">yes</text>
<rect x="230" y="748" width="640" height="80" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="550.0" y="775.638" text-anchor="middle" class="node-title" font-size="10.7" fill="#FFFFFF">Attach profiles[&#x27;plugin_meta&#x27;]</text>
<text x="550.0" y="791.638" text-anchor="middle" class="node-sub" font-size="7.6" fill="#FFFFFF" opacity="0.92">name, label, source, actual strategy, requested strategy, year</text>
<text x="550.0" y="807.638" text-anchor="middle" class="node-sub" font-size="7.6" fill="#FFFFFF" opacity="0.92">v_min/v_max, notes and absolute yaml_path</text>
<rect x="270" y="858" width="560" height="58" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="550.0" y="882.774" text-anchor="middle" class="node-title" font-size="11.1" fill="#FFFFFF">return (net, profiles)</text>
<text x="550.0" y="898.774" text-anchor="middle" class="node-sub" font-size="8.0" fill="#FFFFFF" opacity="0.92">ready for benchmark_runner.run_benchmark</text>
<path d="M550 716 L550 746" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M550 828 L550 856" class="edge-dark" marker-end="url(#arrowDark)"/>
<rect x="80" y="1000" width="340" height="60" rx="9" fill="#0C447C" stroke="none" stroke-width="0"/>
<text x="250.0" y="1025.502" text-anchor="middle" class="node-title" font-size="10.3" fill="#FFFFFF">validate_network_plugin(net, profiles)</text>
<text x="250.0" y="1041.502" text-anchor="middle" class="node-sub" font-size="7.4" fill="#FFFFFF" opacity="0.92">separate caller-invoked public API</text>
<rect x="460" y="984" width="560" height="92" rx="9" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="740.0" y="1009.298" text-anchor="middle" class="node-title" font-size="9.7" fill="#FFFFFF">Compatibility checks</text>
<text x="740.0" y="1025.298" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">sgen/DER types; MV/LV voltage level; two-/three-winding transformer presence</text>
<text x="740.0" y="1041.298" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">ZIP-load shares; profile/load index alignment; missing DER profile columns; NaNs</text>
<text x="740.0" y="1057.298" text-anchor="middle" class="node-sub" font-size="6.9" fill="#FFFFFF" opacity="0.92">append human-readable warning strings only - no exception is raised here</text>
<rect x="480" y="1112" width="520" height="58" rx="12" fill="#3C3489" stroke="none" stroke-width="0"/>
<text x="740.0" y="1136.57" text-anchor="middle" class="node-title" font-size="10.5" fill="#FFFFFF">return warnings: list[str]</text>
<text x="740.0" y="1152.57" text-anchor="middle" class="node-sub" font-size="7.5" fill="#FFFFFF" opacity="0.92">empty list when all checks pass</text>
<path d="M420 1030 L458 1030" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M740 1076 L740 1110" class="edge-dark" marker-end="url(#arrowDark)"/>
<path d="M270 887 L48 887 L48 1030 L78 1030" class="edge-assoc" marker-end="url(#arrowAssoc)"/>
<text x="55" y="965" text-anchor="start" fill="#8A887F" font-size="8.0" font-weight="700">optional caller validation</text>
</svg>